<title>16章 波の干渉 — 2波源の重ね合わせ</title>

<body>
  <div class="page-shell">
    <header class="page-header">
      <div class="hero-icon">〰️</div>
      <h2>16章 波の干渉</h2>
      <p class="chapter-label">2つの波の重ね合わせ · 強め合い · 弱め合い</p>
      <a id="back" href="00_folder_waves.html#chapter-16">← 波動 · 第16章</a>
    </header>

    <section class="panel">
      <h3>干渉とは</h3>
      <ul>
        <li>2つの波が重なると <strong>合成振幅 A = A₁ + A₂</strong></li>
        <li>位相が揃うと<strong>強め合い</strong>（明るい）、ずれると<strong>弱め合い</strong>（暗い）</li>
        <li>波源間隔 d · 波長 λ によって干渉縞の間隔が変わる</li>
      </ul>
      <p class="formula-box">Δx ∝ λ / d（d 大→縞が細かい · λ 大→縞が広い）</p>
    </section>

    <section class="panel">
      <h3>シミュレーション</h3>
      <div class="canvas-wrap"><canvas id="waveCanvas"></canvas></div>
      <div class="legend-row">
        <span style="color:#fde68a">明るい＝強め合い</span>
        <span style="color:#1e3a5f">暗い＝弱め合い</span>
        <span style="color:#fff">○ 波面（白い輪）</span>
        <span style="color:#38bdf8">● 波源</span>
      </div>

      <div class="mode-row">
        <button type="button" id="modePoint" class="active">点波源</button>
        <button type="button" id="modeLine">直線波源</button>
        <button type="button" id="modeSlit">スリット干渉</button>
      </div>

      <div class="count-row" id="countRow">
        <button type="button" id="src1Btn">波源 1 個</button>
        <button type="button" id="src2Btn" class="active">波源 2 個</button>
      </div>

      <div class="param-grid">
        <div>
          <label for="distSlider">波源間隔 d</label>
          <input type="range" id="distSlider" min="30" max="200" step="2" value="90">
          <div class="slider-val" id="distVal">d = 90 px</div>
        </div>
        <div>
          <label for="lambdaSlider">波長 λ</label>
          <input type="range" id="lambdaSlider" min="20" max="80" step="1" value="40">
          <div class="slider-val" id="lambdaVal">λ = 40 px</div>
        </div>
        <div>
          <label for="speedSlider">波の速さ v</label>
          <input type="range" id="speedSlider" min="40" max="180" step="5" value="90">
          <div class="slider-val" id="speedVal">v = 90 px/s</div>
        </div>
        <div>
          <label for="ampSlider">振幅 A</label>
          <input type="range" id="ampSlider" min="30" max="100" step="5" value="70">
          <div class="slider-val" id="ampVal">A = 0.70</div>
        </div>
      </div>

      <div class="toggle-row">
        <label><input type="checkbox" id="fringeToggle" checked> 干渉縞の強調表示</label>
        <label><input type="checkbox" id="rippleToggle" checked> 円形波面（白い輪）を表示</label>
      </div>

      <div class="insight-box" id="insightBox">—</div>
    </section>
  </div>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("waveCanvas");
      var ctx = canvas.getContext("2d");
      var distSlider = document.getElementById("distSlider");
      var lambdaSlider = document.getElementById("lambdaSlider");
      var speedSlider = document.getElementById("speedSlider");
      var ampSlider = document.getElementById("ampSlider");
      var distVal = document.getElementById("distVal");
      var lambdaVal = document.getElementById("lambdaVal");
      var speedVal = document.getElementById("speedVal");
      var ampVal = document.getElementById("ampVal");
      var fringeToggle = document.getElementById("fringeToggle");
      var rippleToggle = document.getElementById("rippleToggle");
      var insightBox = document.getElementById("insightBox");
      var countRow = document.getElementById("countRow");
      var modePoint = document.getElementById("modePoint");
      var modeLine = document.getElementById("modeLine");
      var modeSlit = document.getElementById("modeSlit");
      var src1Btn = document.getElementById("src1Btn");
      var src2Btn = document.getElementById("src2Btn");

      var mode = "point";
      var sourceCount = 2;
      var separation = 90;
      var wavelength = 40;
      var waveSpeed = 90;
      var amplitude = 0.7;
      var emphasizeFringe = true;
      var showRipples = true;
      var simTime = 0;
      var cw = 0;
      var ch = 0;
      var imageData = null;
      var fieldBuf = null;
      var offCanvas = null;
      var offCtx = null;
      var STEP = 2;

      function fitCanvas() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var rect = canvas.getBoundingClientRect();
        cw = rect.width || 600;
        ch = rect.height || 360;
        canvas.width = Math.floor(cw * dpr);
        canvas.height = Math.floor(ch * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var w = Math.ceil(cw / STEP);
        var h = Math.ceil(ch / STEP);
        fieldBuf = new Float32Array(w * h);
        if (!offCanvas) offCanvas = document.createElement("canvas");
        offCanvas.width = w;
        offCanvas.height = h;
        offCtx = offCanvas.getContext("2d");
        imageData = offCtx.createImageData(w, h);
      }

      function getSources() {
        var cx = cw * 0.5;
        var cy = ch * 0.38;
        var list = [];

        if (mode === "point") {
          if (sourceCount === 1) {
            list.push({ x: cx, y: cy });
          } else {
            list.push({ x: cx - separation * 0.5, y: cy });
            list.push({ x: cx + separation * 0.5, y: cy });
          }
          return list;
        }

        if (mode === "line") {
          var n = 17;
          var half = separation * 0.8;
          for (var i = 0; i < n; i++) {
            var t = n === 1 ? 0.5 : i / (n - 1);
            list.push({ x: cx - half + 2 * half * t, y: cy });
          }
          return list;
        }

        // スリット干渉：左の障壁に2つのスリット
        var wallX = cw * 0.28;
        var midY = ch * 0.42;
        var halfD = separation * 0.5;
        list.push({ x: wallX, y: midY - halfD });
        list.push({ x: wallX, y: midY + halfD });
        return list;
      }

      // 合成波 u = Σ A sin(k r - ω t)
      function waveAt(x, y, sources, t) {
        var k = (Math.PI * 2) / wavelength;
        var omega = (Math.PI * 2 * waveSpeed) / wavelength;
        var u = 0;
        var nSrc = sources.length;
        var ampEach = amplitude / (mode === "line" ? Math.sqrt(nSrc) : 1);
        if (sourceCount === 1 && mode === "point") ampEach = amplitude;

        for (var i = 0; i < sources.length; i++) {
          var s = sources[i];
          var dx = x - s.x;
          var dy = y - s.y;
          var r = Math.sqrt(dx * dx + dy * dy);
          u += ampEach * Math.sin(k * r - omega * t);
        }
        return u;
      }

      // 強め合い：黄〜白 · 弱め合い：青〜黒
      function colorFromU(u, maxU, emphasize) {
        var t = (u / maxU + 1) * 0.5;
        if (emphasize) {
          t = Math.pow(Math.max(0, Math.min(1, t)), 0.55);
        } else {
          t = Math.max(0, Math.min(1, t));
        }
        var r, g, b;
        if (t < 0.45) {
          var u2 = t / 0.45;
          r = Math.floor(4 + 20 * u2);
          g = Math.floor(8 + 40 * u2);
          b = Math.floor(24 + 80 * u2);
        } else {
          var u3 = (t - 0.45) / 0.55;
          r = Math.floor(24 + 231 * u3);
          g = Math.floor(48 + 207 * u3);
          b = Math.floor(104 + 151 * u3);
        }
        return [r, g, b];
      }

      function renderField(sources, t) {
        var w = Math.ceil(cw / STEP);
        var h = Math.ceil(ch / STEP);
        var maxU = sourceCount === 1 && mode === "point"
          ? amplitude
          : amplitude * (mode === "line" ? 1.2 : 2);
        var data = imageData.data;
        var idx = 0;

        for (var j = 0; j < h; j++) {
          var y = j * STEP + STEP * 0.5;
          for (var i = 0; i < w; i++) {
            var x = i * STEP + STEP * 0.5;
            var blocked = false;
            if (mode === "slit") {
              var wallX = cw * 0.28;
              var midY = ch * 0.42;
              var gap = separation * 0.22;
              if (x < wallX && Math.abs(y - (midY - separation * 0.5)) > gap &&
                  Math.abs(y - (midY + separation * 0.5)) > gap) {
                blocked = true;
              }
            }
            var u = blocked ? 0 : waveAt(x, y, sources, t);
            fieldBuf[j * w + i] = u;
            var rgb = blocked ? [8, 12, 20] : colorFromU(u, maxU, emphasizeFringe);
            data[idx++] = rgb[0];
            data[idx++] = rgb[1];
            data[idx++] = rgb[2];
            data[idx++] = 255;
          }
        }

        offCtx.putImageData(imageData, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(offCanvas, 0, 0, w, h, 0, 0, cw, ch);
      }

      // 円形波面（白い輪）
      function drawRipples(sources, t) {
        var ringSpacing = wavelength;
        var front = (waveSpeed * t) % ringSpacing;
        ctx.strokeStyle = "rgba(255,255,255,0.38)";
        ctx.lineWidth = 1.2;

        sources.forEach(function (s) {
          for (var n = 0; n < 8; n++) {
            var r = front + n * ringSpacing;
            if (r < 5 || r > Math.max(cw, ch)) continue;
            ctx.beginPath();
            ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
            ctx.stroke();
          }
        });
      }

      function drawSlitBarrier() {
        var wallX = cw * 0.28;
        var midY = ch * 0.42;
        var gap = separation * 0.22;
        ctx.fillStyle = "rgba(30, 41, 59, 0.95)";
        ctx.strokeStyle = "rgba(251, 191, 36, 0.6)";
        ctx.lineWidth = 2;
        ctx.fillRect(0, midY - separation * 0.5 - gap, wallX, gap);
        ctx.fillRect(0, midY + separation * 0.5, wallX, gap);
        ctx.fillRect(0, 0, wallX, midY - separation * 0.5 - gap);
        ctx.fillRect(0, midY + separation * 0.5 + gap, wallX, ch - (midY + separation * 0.5 + gap));
        ctx.strokeRect(0, 0, wallX, ch);
        ctx.fillStyle = "rgba(251,191,36,0.9)";
        ctx.font = "600 11px Inter, sans-serif";
        ctx.fillText("二重スリット", 8, midY - separation * 0.5 - gap - 6);
      }

      function drawSources(sources) {
        sources.forEach(function (s) {
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 10);
          g.addColorStop(0, "#ffffff");
          g.addColorStop(0.4, "#38bdf8");
          g.addColorStop(1, "rgba(56,189,248,0.2)");
          ctx.beginPath();
          ctx.arc(s.x, s.y, 7, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        });
      }

      function updateInsight() {
        var fringePx = wavelength * ch / Math.max(separation, 20);
        if (mode === "line") {
          insightBox.innerHTML =
            "直線波源モード — 多数の点波源が<strong>面波</strong>の干渉縞を作ります。λ を大きくすると縞間隔が広がります。";
        } else if (mode === "slit") {
          insightBox.innerHTML =
            "スリット干渉 — 2つのスリットを通過した波が重なり、右側に<strong>明暗の縞</strong>（ヤングの実験）が現れます。";
        } else if (sourceCount === 1) {
          insightBox.innerHTML = "波源1個 — 同心円状の波のみ。波源を2個にすると干渉縞が現れます。";
        } else {
          insightBox.innerHTML =
            "d=" + separation + " px · λ=" + wavelength + " px — d が大きいと縞は<strong>細かく</strong>、λ が大きいと<strong>広く</strong>なります（目安 Δy∝λ/d ≈ " +
            fringePx.toFixed(0) + " px）。";
        }
      }

      function syncControls() {
        separation = parseInt(distSlider.value, 10);
        wavelength = parseInt(lambdaSlider.value, 10);
        waveSpeed = parseInt(speedSlider.value, 10);
        amplitude = parseInt(ampSlider.value, 10) / 100;
        emphasizeFringe = fringeToggle.checked;
        showRipples = rippleToggle.checked;
        distVal.textContent = "d = " + separation + " px";
        lambdaVal.textContent = "λ = " + wavelength + " px";
        speedVal.textContent = "v = " + waveSpeed + " px/s";
        ampVal.textContent = "A = " + amplitude.toFixed(2);
        updateInsight();
      }

      function setMode(m) {
        mode = m;
        modePoint.classList.toggle("active", m === "point");
        modeLine.classList.toggle("active", m === "line");
        modeSlit.classList.toggle("active", m === "slit");
        countRow.style.display = m === "point" ? "flex" : "none";
        updateInsight();
      }

      function setSourceCount(n) {
        sourceCount = n;
        src1Btn.classList.toggle("active", n === 1);
        src2Btn.classList.toggle("active", n === 2);
        updateInsight();
      }

      distSlider.addEventListener("input", syncControls);
      lambdaSlider.addEventListener("input", syncControls);
      speedSlider.addEventListener("input", syncControls);
      ampSlider.addEventListener("input", syncControls);
      fringeToggle.addEventListener("change", syncControls);
      rippleToggle.addEventListener("change", syncControls);
      modePoint.addEventListener("click", function () { setMode("point"); });
      modeLine.addEventListener("click", function () { setMode("line"); });
      modeSlit.addEventListener("click", function () { setMode("slit"); });
      src1Btn.addEventListener("click", function () { setSourceCount(1); });
      src2Btn.addEventListener("click", function () { setSourceCount(2); });
      window.addEventListener("resize", fitCanvas);

      fitCanvas();
      syncControls();

      var last = 0;
      function loop(ts) {
        if (!last) last = ts;
        var dt = Math.min((ts - last) / 1000, 0.05);
        last = ts;
        simTime += dt;

        var sources = getSources();
        ctx.clearRect(0, 0, cw, ch);
        renderField(sources, simTime);

        if (mode === "slit") drawSlitBarrier();
        if (showRipples) drawRipples(sources, simTime);
        drawSources(sources);

        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
