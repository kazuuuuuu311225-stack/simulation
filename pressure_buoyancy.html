<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="assets/css/physlabo-mobile.css?v=20260809c">
  <script src="assets/js/physlabo-mobile.js?v=20260809c"></script>

  <title>大気圧・水圧・浮力 — 運動の法則</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --accent: #6366f1;
      --accent-light: #a5b4fc;
      --accent-glow: rgba(99, 102, 241, 0.42);
      --slate-bg: rgba(12, 16, 28, 0.82);
      --slate-border: rgba(99, 102, 241, 0.28);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      font-family: "Inter", "Poppins", "Noto Sans JP", sans-serif;
      background: linear-gradient(160deg, #070a12 0%, #0c1018 38%, #121828 72%, #0a0e16 100%);
      color: var(--text);
      min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top)) 0 max(20px, env(safe-area-inset-bottom));
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 55% 42% at 18% 22%, rgba(99, 102, 241, 0.09), transparent 55%),
        radial-gradient(ellipse 60% 40% at 82% 78%, rgba(56, 189, 248, 0.06), transparent 55%);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(1080px, 96vw);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .page-header { text-align: center; }

    h2 {
      margin: 6px 0 4px;
      font-weight: 600;
      color: var(--accent-light);
      text-shadow: 0 0 20px var(--accent-glow);
    }

    .chapter-label {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    #back {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      color: #e0e7ff;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.42);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    .sim-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 860px) {
      .sim-grid {
        grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
        align-items: stretch;
      }
    }

    .panel {
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--slate-bg);
      border: 1px solid var(--slate-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.42);
    }

    .canvas-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 320px;
    }

    .canvas-label {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent-light);
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: min(480px, 58dvh);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(8, 12, 22, 0.98), rgba(4, 8, 16, 0.99));
      border: 1px solid rgba(99, 102, 241, 0.32);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 8px 32px rgba(0, 0, 0, 0.45),
        0 0 48px rgba(99, 102, 241, 0.08);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .side-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #ui {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #ui h3 {
      margin: 0 0 4px;
      font-size: 0.95rem;
      color: var(--accent-light);
    }

    label {
      display: block;
      font-size: 0.92rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    input[type="range"] {
      width: 100%;
      height: 30px;
      accent-color: var(--accent);
    }

    .hint {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-row button {
      flex: 1;
      padding: 14px 12px;
      min-height: 48px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #startBtn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
    }

    #resetBtn {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 2px solid rgba(148, 163, 184, 0.28);
    }

    #motionStatus {
      padding: 12px 16px;
      border-radius: 14px;
      text-align: center;
      font-weight: 600;
      background: rgba(8, 12, 22, 0.75);
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    #motionStatus.rise {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.4);
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.12);
    }

    #motionStatus.sink {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.4);
      box-shadow: 0 0 20px rgba(248, 113, 113, 0.12);
    }

    #motionStatus.rest {
      color: var(--accent-light);
      border-color: rgba(99, 102, 241, 0.35);
    }

    .legend {
      font-size: 0.82rem;
      line-height: 1.8;
      color: var(--muted);
    }

    .legend span { font-weight: 600; }
    .lg-pa { color: #7dd3fc; text-shadow: 0 0 8px rgba(125, 211, 252, 0.5); }
    .lg-pw { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
    .lg-fb { color: #34d399; text-shadow: 0 0 8px rgba(52, 211, 153, 0.5); }
    .lg-fg { color: #f87171; text-shadow: 0 0 8px rgba(248, 113, 113, 0.5); }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <h2>大気圧・水圧・浮力</h2>
      <p class="chapter-label">4章　運動の法則</p>
      <a id="back" href="00_folder_classical.html#chapter-4">← ホームへ戻る</a>
    </header>

    <div class="sim-grid">
      <section class="panel canvas-panel">
        <p class="canvas-label">左：水槽の様子　／　右：力のベクトル（拡大）</p>
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas"></canvas>
        </div>
      </section>

      <div class="side-column">
        <section class="panel" id="ui">
          <h3>パラメータ</h3>
          <label>
            深さ h (m):
            <input id="hSlider" type="range" min="0" max="5" step="0.1" value="2">
            <span id="hValue">2.0</span>
          </label>

          <label>
            液体の密度 ρ (kg/m³):
            <input id="rhoLiquidSlider" type="range" min="500" max="1500" step="10" value="1000">
            <span id="rhoLiquidValue">1000</span>
          </label>

          <label>
            物体の密度 (kg/m³):
            <input id="rhoSlider" type="range" min="100" max="2000" step="10" value="800">
            <span id="rhoValue">800</span>
          </label>

          <label>
            重力 g (m/s²):
            <input id="gSlider" type="range" min="0" max="20" step="0.1" value="9.8">
            <span id="gValue">9.8</span>
          </label>

          <p class="hint">液体の密度 ρ と物体の密度を変えて浮力を比べられます。立方体 V = 0.008 m³（一辺 20 cm）。深さ h は物体中心の水面下の深さです。</p>

          <div class="btn-row">
            <button id="startBtn" type="button">スタート</button>
            <button id="resetBtn" type="button">リセット</button>
          </div>
        </section>

        <div id="motionStatus" class="rest">静止</div>

        <section class="panel legend">
          <span class="lg-pa">■ 大気圧 Pa</span>　
          <span class="lg-pw">■ 水圧 P</span>　
          <span class="lg-fb">■ 浮力 FB</span>　
          <span class="lg-fg">■ 重力 Fg</span>
        </section>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const canvasWrap = document.getElementById("canvasWrap");
    const motionStatus = document.getElementById("motionStatus");
    const hSlider = document.getElementById("hSlider");
    const rhoLiquidSlider = document.getElementById("rhoLiquidSlider");
    const rhoSlider = document.getElementById("rhoSlider");
    const gSlider = document.getElementById("gSlider");

    const P_ATM = 101325;
    const CUBE_SIDE = 0.2;
    const VOLUME = CUBE_SIDE ** 3;
    const TANK_DEPTH = 6;
    const MAX_DT = 1 / 30;
    const CUBE_VISUAL_HALF = 44;
    const FORCE_DIAG_SCALE = 0.42;
    const PRESS_MIN_PX = 22;
    const PRESS_MAX_PX = 52;
    const GRID_CELL = 40;

    const COL = {
      accent: "#6366f1",
      press: "#38bdf8",
      pressGlow: "rgba(56, 189, 248, 0.65)",
      buoy: "#34d399",
      buoyGlow: "rgba(52, 211, 153, 0.7)",
      grav: "#f87171",
      gravGlow: "rgba(248, 113, 113, 0.7)",
      atm: "#7dd3fc",
      text: "#cbd5e1",
      muted: "#94a3b8"
    };

    let objDepth = parseFloat(hSlider.value);
    let objVel = 0;
    let running = false;
    let layout = { w: 0, h: 0, dpr: 1 };

    const DEFAULTS = { h: 2, rhoLiquid: 1000, rho: 800, g: 9.8 };

    function fmt(v, d) {
      return Number(v).toFixed(d);
    }

    function syncSliders() {
      document.getElementById("hValue").textContent = fmt(parseFloat(hSlider.value), 1);
      document.getElementById("rhoLiquidValue").textContent = rhoLiquidSlider.value;
      document.getElementById("rhoValue").textContent = rhoSlider.value;
      document.getElementById("gValue").textContent = fmt(parseFloat(gSlider.value), 1);
    }

    function physicsState(depth) {
      const g = parseFloat(gSlider.value);
      const rhoLiquid = parseFloat(rhoLiquidSlider.value);
      const rhoObj = parseFloat(rhoSlider.value);
      const h = Math.max(0, depth);
      const m = rhoObj * VOLUME;
      const P = rhoLiquid * g * h;
      const FB = rhoLiquid * g * VOLUME;
      const Fg = m * g;
      const Fnet = FB - Fg;
      return { g, rhoLiquid, rhoObj, h, m, P, FB, Fg, Fnet, Pa: P_ATM };
    }

    function resetSimulation() {
      hSlider.value = DEFAULTS.h;
      rhoLiquidSlider.value = DEFAULTS.rhoLiquid;
      rhoSlider.value = DEFAULTS.rho;
      gSlider.value = DEFAULTS.g;
      objDepth = DEFAULTS.h;
      objVel = 0;
      running = false;
      syncSliders();
    }

    function startSimulation() {
      objDepth = parseFloat(hSlider.value);
      objVel = 0;
      running = true;
      syncSliders();
    }

    function applyDepthFromSlider() {
      if (running) return;
      objDepth = parseFloat(hSlider.value);
      objVel = 0;
    }

    function resizeCanvas() {
      const rect = canvasWrap.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const w = Math.max(280, Math.round(rect.width));
      const h = Math.max(280, Math.round(rect.height));
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }
      layout = { w, h, dpr };
    }

    function setupCtx() {
      ctx.setTransform(layout.dpr, 0, 0, layout.dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
    }

    function drawDarkBg(w, h) {
      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, "#070a10");
      bg.addColorStop(0.5, "#0c1220");
      bg.addColorStop(1, "#101828");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(148, 163, 184, 0.055)";
      ctx.lineWidth = 1;
      for (let i = 0; i < w; i += GRID_CELL) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, h);
        ctx.stroke();
      }
      for (let j = 0; j < h; j += GRID_CELL) {
        ctx.beginPath();
        ctx.moveTo(0, j);
        ctx.lineTo(w, j);
        ctx.stroke();
      }

      const glow = ctx.createRadialGradient(w * 0.5, h * 0.45, 0, w * 0.5, h * 0.48, w * 0.62);
      glow.addColorStop(0, "rgba(99, 102, 241, 0.12)");
      glow.addColorStop(0.55, "rgba(56, 189, 248, 0.05)");
      glow.addColorStop(1, "rgba(8, 12, 20, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      const vig = ctx.createRadialGradient(w * 0.5, h * 0.5, h * 0.2, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
      vig.addColorStop(0, "rgba(0, 0, 0, 0)");
      vig.addColorStop(1, "rgba(0, 0, 0, 0.35)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
    }

    [hSlider, rhoLiquidSlider, rhoSlider, gSlider].forEach((s) => {
      s.addEventListener("input", () => {
        syncSliders();
        if (s === hSlider) applyDepthFromSlider();
      });
      s.addEventListener("change", syncSliders);
    });

    document.getElementById("startBtn").addEventListener("click", (e) => {
      e.preventDefault();
      startSimulation();
    });

    document.getElementById("resetBtn").addEventListener("click", (e) => {
      e.preventDefault();
      resetSimulation();
    });

    window.addEventListener("resize", resizeCanvas);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(resizeCanvas).observe(canvasWrap);
    }

    requestAnimationFrame(() => {
      resizeCanvas();
      resetSimulation();
    });

    function update(dt) {
      if (!running) return;
      const state = physicsState(objDepth);
      if (Math.abs(state.Fnet) < 0.01 || state.m <= 0) {
        objVel = 0;
        running = false;
        return;
      }
      const a = state.Fnet / state.m;
      objVel += a * dt;
      objDepth -= objVel * dt;

      const minD = CUBE_SIDE / 2;
      const maxD = TANK_DEPTH - CUBE_SIDE / 2;
      if (objDepth < minD) {
        objDepth = minD;
        objVel = 0;
        running = false;
      } else if (objDepth > maxD) {
        objDepth = maxD;
        objVel = 0;
        running = false;
      }

      if (running) {
        hSlider.value = Math.min(5, Math.max(0, objDepth)).toFixed(1);
      }
    }

    function worldLayout(w, h) {
      const pad = 12;
      const splitX = Math.floor(w * 0.42);
      const tank = {
        left: pad + 8,
        right: splitX - pad,
        top: pad + 8,
        bottom: h - pad - 8
      };
      const force = {
        left: splitX + pad,
        right: w - pad - 8,
        top: pad + 8,
        bottom: h - pad - 8
      };
      function depthToY(depth, region) {
        return region.top + (depth / TANK_DEPTH) * (region.bottom - region.top);
      }
      return { tank, force, depthToY };
    }

    function pressToPx(pressure, g, rhoLiquid) {
      const ref = rhoLiquid * Math.max(g, 1) * TANK_DEPTH;
      const t = Math.min(1, pressure / ref);
      return PRESS_MIN_PX + t * (PRESS_MAX_PX - PRESS_MIN_PX);
    }

    function drawArrow(x, y, dx, dy, color, lw, label, opts) {
      const o = opts || {};
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 2) return;
      const tx = x + dx;
      const ty = y + dy;

      ctx.save();
      if (o.glow !== false) {
        ctx.shadowColor = o.glowColor || color;
        ctx.shadowBlur = o.glowBlur || 14;
      }

      if (o.dashed) ctx.setLineDash([5, 4]);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.setLineDash([]);

      const ang = Math.atan2(dy, dx);
      const head = Math.min(12, len * 0.28);
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - head * Math.cos(ang - Math.PI / 7), ty - head * Math.sin(ang - Math.PI / 7));
      ctx.lineTo(tx - head * Math.cos(ang + Math.PI / 7), ty - head * Math.sin(ang + Math.PI / 7));
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      if (!label) return;
      const lx = tx + (o.lx ?? 5);
      const ly = ty + (o.ly ?? -5);
      drawLabelTag(lx, ly, label, color, o.align || "left", o.baseline || "middle");
    }

    function drawLabelTag(x, y, text, color, align, baseline) {
      ctx.font = "bold 11px Inter, Poppins, Noto Sans JP, sans-serif";
      ctx.textAlign = align || "left";
      ctx.textBaseline = baseline || "middle";
      const tw = ctx.measureText(text).width + 10;
      let hx = x - 5;
      if (align === "center") hx = x - tw / 2;
      else if (align === "right") hx = x - tw + 5;
      ctx.fillStyle = "rgba(8, 12, 22, 0.92)";
      ctx.fillRect(hx, y - 9, tw, 18);
      ctx.strokeStyle = "rgba(99, 102, 241, 0.35)";
      ctx.lineWidth = 1;
      ctx.strokeRect(hx, y - 9, tw, 18);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      ctx.textAlign = "start";
      ctx.textBaseline = "alphabetic";
    }

    function drawCube(cx, cy, half, fill, stroke) {
      ctx.save();
      ctx.shadowColor = "rgba(99, 102, 241, 0.35)";
      ctx.shadowBlur = 10;
      ctx.fillStyle = fill || "rgba(226, 232, 240, 0.92)";
      ctx.strokeStyle = stroke || COL.accent;
      ctx.lineWidth = 2.5;
      ctx.fillRect(cx - half, cy - half, half * 2, half * 2);
      ctx.strokeRect(cx - half, cy - half, half * 2, half * 2);
      ctx.restore();
    }

    function drawTankPanel(state, layout) {
      const region = layout.tank;
      const cx = (region.left + region.right) / 2;
      const cy = layout.depthToY(objDepth, region);
      const tankW = region.right - region.left;
      const tankH = region.bottom - region.top;

      ctx.save();
      ctx.fillStyle = "rgba(6, 10, 18, 0.85)";
      ctx.fillRect(region.left, region.top, tankW, tankH);

      const waterAlpha = 0.35 + 0.35 * Math.min(1, state.rhoLiquid / 1500);
      const waterGrad = ctx.createLinearGradient(region.left, region.top, region.left, region.bottom);
      waterGrad.addColorStop(0, `rgba(30, 58, 138, ${waterAlpha * 0.55})`);
      waterGrad.addColorStop(0.35, `rgba(14, 116, 144, ${waterAlpha})`);
      waterGrad.addColorStop(1, `rgba(8, 47, 73, ${waterAlpha * 1.1})`);
      ctx.fillStyle = waterGrad;
      ctx.fillRect(region.left, region.top, tankW, tankH);

      ctx.shadowColor = "rgba(56, 189, 248, 0.25)";
      ctx.shadowBlur = 16;
      ctx.strokeStyle = "rgba(56, 189, 248, 0.55)";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(region.left, region.top, tankW, tankH);
      ctx.shadowBlur = 0;

      ctx.strokeStyle = "rgba(125, 211, 252, 0.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(region.left, region.top);
      ctx.lineTo(region.right, region.top);
      ctx.stroke();

      ctx.fillStyle = COL.atm;
      ctx.font = "12px Inter, Poppins, Noto Sans JP, sans-serif";
      ctx.fillText("水面", region.left + 6, region.top - 6);

      ctx.strokeStyle = "rgba(99, 102, 241, 0.45)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(region.left, cy);
      ctx.lineTo(region.right, cy);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = COL.muted;
      ctx.font = "11px Inter, Poppins, sans-serif";
      ctx.fillText(`h=${fmt(state.h, 1)}m`, region.right - 58, cy - 6);

      drawCube(cx, cy, CUBE_VISUAL_HALF, "rgba(226, 232, 240, 0.9)", COL.accent);

      ctx.fillStyle = COL.text;
      ctx.font = "12px Inter, Poppins, Noto Sans JP, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`ρ=${fmt(state.rhoLiquid, 0)} kg/m³`, (region.left + region.right) / 2, region.top + 18);
      ctx.fillText("水槽（横断面）", (region.left + region.right) / 2, region.bottom + 18);
      ctx.textAlign = "start";
      ctx.restore();
    }

    function drawForcePanel(state, layout) {
      const f = layout.force;
      const panelW = f.right - f.left;
      const panelH = f.bottom - f.top;
      const cx = (f.left + f.right) / 2;

      const infoH = 72;
      const infoY = f.bottom - 10 - infoH;
      const diagramTop = f.top + 34;
      const diagramBottom = infoY - 10;
      const cy = (diagramTop + diagramBottom) / 2;
      const half = Math.min(34, Math.max(26, (diagramBottom - diagramTop) * 0.18));
      const fbX = cx - 22;
      const fgX = cx + 22;

      ctx.fillStyle = "rgba(8, 12, 22, 0.72)";
      ctx.fillRect(f.left, f.top, panelW, panelH);
      ctx.strokeStyle = "rgba(99, 102, 241, 0.28)";
      ctx.lineWidth = 2;
      ctx.strokeRect(f.left, f.top, panelW, panelH);

      ctx.fillStyle = COL.accent;
      ctx.font = "13px Inter, Poppins, Noto Sans JP, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("力のベクトル（拡大）", cx, f.top + 20);
      ctx.textAlign = "start";

      const pTop = state.rhoLiquid * state.g * Math.max(0, state.h - CUBE_SIDE / 2);
      const pBottom = state.rhoLiquid * state.g * (state.h + CUBE_SIDE / 2);
      const pSide = state.rhoLiquid * state.g * state.h;
      const maxPressPx = Math.min(PRESS_MAX_PX, half + 18);
      const pTopPx = Math.min(pressToPx(pTop, state.g, state.rhoLiquid), maxPressPx);
      const pBottomPx = Math.min(pressToPx(pBottom, state.g, state.rhoLiquid), maxPressPx);
      const pSidePx = Math.min(pressToPx(pSide, state.g, state.rhoLiquid), maxPressPx - 4);

      drawCube(cx, cy, half, "rgba(226, 232, 240, 0.88)", COL.accent);

      drawArrow(cx, cy - half - pTopPx, 0, pTopPx, COL.press, 3, null, { glowColor: COL.pressGlow });
      drawLabelTag(cx, cy - half - pTopPx - 14, "P（上）", COL.press, "center");

      drawArrow(cx, cy + half + pBottomPx, 0, -pBottomPx, COL.press, 3, null, { glowColor: COL.pressGlow });
      drawLabelTag(cx, cy + half + pBottomPx + 14, "P（下）", COL.press, "center");

      drawArrow(cx - half - pSidePx, cy, pSidePx, 0, COL.press, 3, null, { glowColor: COL.pressGlow });
      drawLabelTag(f.left + 8, cy, "P（左）", COL.press, "left");

      drawArrow(cx + half + pSidePx, cy, -pSidePx, 0, COL.press, 3, null, { glowColor: COL.pressGlow });
      drawLabelTag(f.right - 8, cy, "P（右）", COL.press, "right");

      const fbLen = Math.max(14, Math.min(state.FB * FORCE_DIAG_SCALE, cy - half - diagramTop - 28));
      const fgLen = Math.max(14, Math.min(state.Fg * FORCE_DIAG_SCALE, diagramBottom - cy - half - 28));

      drawArrow(fbX, cy, 0, fbLen, COL.buoy, 4, null, { glowColor: COL.buoyGlow, glowBlur: 18 });
      drawLabelTag(fbX - 6, cy - fbLen - 12, `FB=${fmt(state.FB, 1)}N`, COL.buoy, "right");

      drawArrow(fgX, cy, 0, -fgLen, COL.grav, 4, null, { glowColor: COL.gravGlow, glowBlur: 18 });
      drawLabelTag(fgX + 6, cy + fgLen + 12, `Fg=${fmt(state.Fg, 1)}N`, COL.grav, "left");

      const infoX = f.left + 10;
      const infoW = panelW - 20;
      ctx.fillStyle = "rgba(12, 18, 32, 0.92)";
      ctx.fillRect(infoX, infoY, infoW, infoH);
      ctx.strokeStyle = "rgba(99, 102, 241, 0.3)";
      ctx.strokeRect(infoX, infoY, infoW, infoH);
      ctx.fillStyle = COL.text;
      ctx.font = "11px Inter, Poppins, Noto Sans JP, sans-serif";
      const lines = [
        `ρ = ${fmt(state.rhoLiquid, 0)} kg/m³　P = ${fmt(state.P / 1000, 1)} kPa　Pa = ${fmt(state.Pa / 1000, 0)} kPa`,
        `浮力 FB = ρgV = ${fmt(state.FB, 1)} N　重力 Fg = ${fmt(state.Fg, 1)} N`,
        `合力 Fnet = ${fmt(state.Fnet, 1)} N`
      ];
      lines.forEach((line, i) => ctx.fillText(line, infoX + 8, infoY + 22 + i * 18));
    }

    function draw() {
      syncSliders();
      const state = physicsState(objDepth);
      const w = layout.w;
      const h = layout.h;
      const layoutMap = worldLayout(w, h);

      setupCtx();
      drawDarkBg(w, h);
      drawTankPanel(state, layoutMap);
      drawForcePanel(state, layoutMap);

      ctx.strokeStyle = "rgba(99, 102, 241, 0.22)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(Math.floor(w * 0.42), 8);
      ctx.lineTo(Math.floor(w * 0.42), h - 8);
      ctx.stroke();

      if (objDepth <= CUBE_SIDE / 2 + 0.02 && state.Fnet > 0.05 && !running) {
        motionStatus.textContent = "水面で浮いている";
        motionStatus.className = "rise";
      } else if (!running) {
        if (state.Fnet > 0.05) {
          motionStatus.textContent = "スタートで上昇（浮く）";
          motionStatus.className = "rise";
        } else if (state.Fnet < -0.05) {
          motionStatus.textContent = "スタートで下降（沈む）";
          motionStatus.className = "sink";
        } else {
          motionStatus.textContent = "つり合い — スタート待ち";
          motionStatus.className = "rest";
        }
      } else if (state.Fnet > 0.05) {
        motionStatus.textContent = objVel > 0.02 ? "浮力 ＞ 重力 → 上昇（浮く）" : "浮力 ＞ 重力 → 浮上中";
        motionStatus.className = "rise";
      } else if (state.Fnet < -0.05) {
        motionStatus.textContent = objVel < -0.02 ? "浮力 ＜ 重力 → 下降（沈む）" : "浮力 ＜ 重力 → 沈下中";
        motionStatus.className = "sink";
      } else {
        motionStatus.textContent = "浮力 ＝ 重力 → 静止";
        motionStatus.className = "rest";
      }
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, MAX_DT);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
