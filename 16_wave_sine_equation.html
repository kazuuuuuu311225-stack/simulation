<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>16章 正弦波の式 — y = A sin(2π(t/T − x/λ))</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --accent: #38bdf8;
      --accent-light: #7dd3fc;
      --panel: rgba(12, 18, 32, 0.82);
      --border: rgba(56, 189, 248, 0.24);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans JP", sans-serif;
      background: linear-gradient(165deg, #050810 0%, #0c1524 45%, #0a1220 100%);
      color: var(--text);
      min-height: 100dvh;
      padding: max(10px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
    }
    .page-shell {
      width: min(980px, 96vw);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .page-header { text-align: center; }
    .hero-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(56,189,248,0.35), rgba(255,255,255,0.15));
      border: 1px solid rgba(125,211,252,0.35);
      font-size: 1.3rem;
    }
    h2 { margin: 6px 0 4px; font-weight: 600; color: var(--accent-light); }
    .chapter-label { margin: 0; font-size: 0.82rem; color: var(--muted); }
    #back {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 16px;
      color: #e0f2fe;
      background: rgba(56,189,248,0.14);
      border: 1px solid rgba(125,211,252,0.38);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
    }
    section.panel {
      border-radius: 14px;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
    }
    section.panel h3 { margin: 0 0 10px; font-size: 1.05rem; color: var(--accent-light); }
    section.panel p, section.panel li { font-size: 0.88rem; line-height: 1.75; color: #cbd5e1; }
    section.panel ul { margin: 8px 0 0; padding-left: 1.2rem; }
    .formula-live {
      margin-top: 10px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.28);
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      color: #e0f2fe;
      font-variant-numeric: tabular-nums;
      line-height: 1.6;
    }
    .formula-live .val { color: #fde68a; }
    .canvas-wrap {
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
      background: #060a12;
      border: 1px solid rgba(56,189,248,0.22);
    }
    .canvas-wrap canvas {
      display: block;
      width: 100%;
      height: min(360px, 42dvh);
      min-height: 240px;
    }
    .param-grid {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }
    @media (min-width: 640px) {
      .param-grid { grid-template-columns: repeat(3, 1fr); }
    }
    label { display: block; font-size: 0.86rem; color: #cbd5e1; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .slider-val { font-size: 0.82rem; font-weight: 700; color: #7dd3fc; font-variant-numeric: tabular-nums; }
    .mode-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .mode-row button {
      flex: 1 1 180px;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(255,255,255,0.05);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-row button.active {
      background: rgba(56,189,248,0.2);
      color: #e0f2fe;
      border-color: rgba(56,189,248,0.45);
    }
    .readout-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    @media (min-width: 640px) {
      .readout-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .readout {
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.16);
    }
    .readout .lbl { display: block; font-size: 0.65rem; color: var(--muted); margin-bottom: 4px; }
    .readout .val { font-size: 0.95rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
    .readout .val.hl { color: #fde68a; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; }
    .btn-row button {
      flex: 1;
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(56,189,248,0.35);
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #startBtn { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; border: none; }
    .insight-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.22);
      font-size: 0.86rem;
      line-height: 1.65;
      color: #bae6fd;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div class="hero-icon">∿</div>
      <h2>16章 正弦波の式</h2>
      <p class="chapter-label">振幅 · 波長 · 周期 · 進行波</p>
      <a id="back" href="00_folder_waves.html#chapter-16">← メニューに戻る</a>
    </header>

    <section class="panel">
      <h3>正弦波の式</h3>
      <ul>
        <li><strong>A</strong>：振幅 — 波の高さ</li>
        <li><strong>T</strong>：周期 — 1 振動にかかる時間</li>
        <li><strong>λ</strong>：波長 — 1 周期分の空間的な長さ</li>
        <li>波の速さ <strong>v = λ / T</strong></li>
      </ul>
      <p class="formula-live" id="formulaLive">y = A sin(2π(t/T − x/λ))</p>
    </section>

    <section class="panel">
      <h3>シミュレーション</h3>
      <div class="canvas-wrap"><canvas id="waveCanvas"></canvas></div>

      <div class="mode-row">
        <button type="button" id="modeTravel" class="active">進行波モード</button>
        <button type="button" id="modeStatic">静止波モード（形だけ）</button>
      </div>

      <div class="param-grid">
        <div>
          <label for="ampSlider">振幅 A [px]</label>
          <input type="range" id="ampSlider" min="10" max="120" step="2" value="60">
          <div class="slider-val" id="ampVal">A = 60</div>
        </div>
        <div>
          <label for="lambdaSlider">波長 λ [px]</label>
          <input type="range" id="lambdaSlider" min="40" max="240" step="4" value="120">
          <div class="slider-val" id="lambdaVal">λ = 120</div>
        </div>
        <div>
          <label for="periodSlider">周期 T [s]</label>
          <input type="range" id="periodSlider" min="5" max="40" step="1" value="16">
          <div class="slider-val" id="periodVal">T = 1.6 s</div>
        </div>
      </div>

      <div class="readout-grid">
        <div class="readout">
          <span class="lbl">振幅 A</span>
          <span class="val" id="readA">60 px</span>
        </div>
        <div class="readout">
          <span class="lbl">波長 λ</span>
          <span class="val" id="readL">120 px</span>
        </div>
        <div class="readout">
          <span class="lbl">周期 T</span>
          <span class="val" id="readT">1.6 s</span>
        </div>
        <div class="readout">
          <span class="lbl">v = λ/T</span>
          <span class="val hl" id="readV">75 px/s</span>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" id="startBtn">スタート</button>
        <button type="button" id="stopBtn">ストップ</button>
      </div>

      <div class="insight-box" id="insightBox">—</div>
    </section>
  </div>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("waveCanvas");
      var ctx = canvas.getContext("2d");
      var ampSlider = document.getElementById("ampSlider");
      var lambdaSlider = document.getElementById("lambdaSlider");
      var periodSlider = document.getElementById("periodSlider");
      var ampVal = document.getElementById("ampVal");
      var lambdaVal = document.getElementById("lambdaVal");
      var periodVal = document.getElementById("periodVal");
      var formulaLive = document.getElementById("formulaLive");
      var readA = document.getElementById("readA");
      var readL = document.getElementById("readL");
      var readT = document.getElementById("readT");
      var readV = document.getElementById("readV");
      var insightBox = document.getElementById("insightBox");
      var modeTravel = document.getElementById("modeTravel");
      var modeStatic = document.getElementById("modeStatic");
      var startBtn = document.getElementById("startBtn");
      var stopBtn = document.getElementById("stopBtn");

      var A = 60;
      var lambda = 120;
      var T = 1.6;
      var traveling = true;
      var running = true;
      var simTime = 0;
      var cw = 0;
      var ch = 0;

      function fitCanvas() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var rect = canvas.getBoundingClientRect();
        cw = rect.width || 600;
        ch = rect.height || 280;
        canvas.width = Math.floor(cw * dpr);
        canvas.height = Math.floor(ch * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // y(x, t) = A sin(2π(t/T − x/λ))  — x 右方向、波は右へ進む
      function waveY(x, t) {
        var phase = Math.PI * 2 * (t / T - x / lambda);
        return A * Math.sin(phase);
      }

      // 定常波（形だけ）y(x) = A sin(2π x/λ)
      function staticY(x) {
        return A * Math.sin((Math.PI * 2 * x) / lambda);
      }

      function syncControls() {
        A = parseInt(ampSlider.value, 10);
        lambda = parseInt(lambdaSlider.value, 10);
        T = parseInt(periodSlider.value, 10) / 10;
        var v = lambda / T;

        ampVal.textContent = "A = " + A;
        lambdaVal.textContent = "λ = " + lambda;
        periodVal.textContent = "T = " + T.toFixed(1) + " s";
        readA.textContent = A + " px";
        readL.textContent = lambda + " px";
        readT.textContent = T.toFixed(1) + " s";
        readV.textContent = v.toFixed(1) + " px/s";

        if (traveling) {
          formulaLive.innerHTML =
            "y = <span class=\"val\">" + A + "</span> sin(2π(" +
            "t/<span class=\"val\">" + T.toFixed(1) + "</span> − " +
            "x/<span class=\"val\">" + lambda + "</span>))";
          insightBox.innerHTML =
            "進行波 — T を短くすると速く（v=λ/T）、λ を大きくするとゆったりした波。A で高さが変わります。";
        } else {
          formulaLive.innerHTML =
            "y = <span class=\"val\">" + A + "</span> sin(2π x/<span class=\"val\">" + lambda + "</span>)";
          insightBox.innerHTML =
            "静止波モード — y(x)=A sin(2πx/λ)。時間 t を固定し、振幅 A と波長 λ だけの関係を見ます。";
        }
      }

      function drawGrid(cy) {
        ctx.strokeStyle = "rgba(148,163,184,0.12)";
        ctx.lineWidth = 1;
        for (var gx = 0; gx < cw; gx += 40) {
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.lineTo(gx, ch);
          ctx.stroke();
        }
        for (var gy = 0; gy < ch; gy += 40) {
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(cw, gy);
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(56,189,248,0.45)";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(0, cy);
        ctx.lineTo(cw, cy);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawWave(t) {
        var cy = ch * 0.5;
        var margin = 24;
        var steps = Math.max(120, Math.floor(cw / 2));

        ctx.clearRect(0, 0, cw, ch);

        var bg = ctx.createLinearGradient(0, 0, cw, ch);
        bg.addColorStop(0, "#060a12");
        bg.addColorStop(1, "#0c1524");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, cw, ch);

        drawGrid(cy);

        // 振幅の目安
        ctx.strokeStyle = "rgba(251,191,36,0.35)";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(margin, cy - A);
        ctx.lineTo(cw - margin, cy - A);
        ctx.moveTo(margin, cy + A);
        ctx.lineTo(cw - margin, cy + A);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(251,191,36,0.75)";
        ctx.font = "600 10px Inter, sans-serif";
        ctx.fillText("+A", margin, cy - A - 4);
        ctx.fillText("−A", margin, cy + A + 12);

        // 波長 λ の目安（平衡位置から）
        ctx.strokeStyle = "rgba(167,139,250,0.5)";
        ctx.beginPath();
        ctx.moveTo(margin, cy + A + 22);
        ctx.lineTo(margin + lambda, cy + A + 22);
        ctx.stroke();
        ctx.fillStyle = "rgba(196,181,253,0.85)";
        ctx.fillText("λ", margin + lambda * 0.45, cy + A + 18);

        // 正弦波（青〜白グラデーション）
        var grad = ctx.createLinearGradient(0, cy - A - 10, 0, cy + A + 10);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.35, "#7dd3fc");
        grad.addColorStop(0.7, "#2563eb");
        grad.addColorStop(1, "#1e3a8a");

        ctx.beginPath();
        for (var i = 0; i <= steps; i++) {
          var x = margin + (i / steps) * (cw - 2 * margin);
          var y = traveling ? waveY(x - margin, t) : staticY(x - margin);
          var py = cy - y;
          if (i === 0) ctx.moveTo(x, py);
          else ctx.lineTo(x, py);
        }
        ctx.strokeStyle = grad;
        ctx.lineWidth = 3;
        ctx.shadowColor = "rgba(56,189,248,0.6)";
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 進行方向矢印
        if (traveling && running) {
          ctx.fillStyle = "rgba(186,230,253,0.9)";
          ctx.font = "600 12px Inter, sans-serif";
          ctx.fillText("→ 波の進行", cw - 100, 22);
        }

        ctx.fillStyle = "rgba(148,163,184,0.8)";
        ctx.font = "600 11px Inter, sans-serif";
        ctx.fillText("t = " + t.toFixed(2) + " s", 12, 20);
      }

      modeTravel.addEventListener("click", function () {
        traveling = true;
        modeTravel.classList.add("active");
        modeStatic.classList.remove("active");
        syncControls();
      });

      modeStatic.addEventListener("click", function () {
        traveling = false;
        modeStatic.classList.add("active");
        modeTravel.classList.remove("active");
        syncControls();
      });

      startBtn.addEventListener("click", function () { running = true; });
      stopBtn.addEventListener("click", function () { running = false; });

      ampSlider.addEventListener("input", syncControls);
      lambdaSlider.addEventListener("input", syncControls);
      periodSlider.addEventListener("input", syncControls);
      window.addEventListener("resize", fitCanvas);

      fitCanvas();
      syncControls();

      var last = 0;
      function loop(ts) {
        if (!last) last = ts;
        var dt = Math.min((ts - last) / 1000, 0.05);
        last = ts;
        if (running && traveling) simTime += dt;
        drawWave(simTime);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
