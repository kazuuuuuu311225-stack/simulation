    </header>

    <section class="panel">
      <h3>波長と色の対応</h3>
      <table class="spectrum-table" id="colorTable">
        <thead>
          <tr><th>色</th><th>波長 [nm]</th></tr>
        </thead>
        <tbody>
          <tr data-min="380" data-max="450"><td><span class="swatch" style="background:#8b5cf6"></span>紫</td><td>380 – 450</td></tr>
          <tr data-min="450" data-max="495"><td><span class="swatch" style="background:#3b82f6"></span>青</td><td>450 – 495</td></tr>
          <tr data-min="495" data-max="570"><td><span class="swatch" style="background:#22c55e"></span>緑</td><td>495 – 570</td></tr>
          <tr data-min="570" data-max="590"><td><span class="swatch" style="background:#eab308"></span>黄</td><td>570 – 590</td></tr>
          <tr data-min="590" data-max="620"><td><span class="swatch" style="background:#f97316"></span>橙</td><td>590 – 620</td></tr>
          <tr data-min="620" data-max="780"><td><span class="swatch" style="background:#ef4444"></span>赤</td><td>620 – 780</td></tr>
        </tbody>
      </table>

    <section class="panel">
      <h3>シミュレーション</h3>
      <div class="canvas-wrap"><canvas id="lightCanvas"></canvas></div>

      <div class="mode-row">
        <button type="button" id="modeBand" class="active">光の帯</button>
        <button type="button" id="modeSpectrum">スペクトルバー</button>
        <button type="button" id="modePrism">プリズム分解</button>
        <button type="button" id="modeEmission">明線スペクトル</button>
        <button type="button" id="modeAbsorption">吸収スペクトル</button>
      </div>

      <div class="sub-tab-row" id="emissionTabs">
        <button type="button" class="active" data-emission="hydrogen">水素</button>
        <button type="button" data-emission="mercury">水銀の蒸気</button>
        <button type="button" data-emission="sodium">ナトリウムの蒸気</button>
      </div>
      <div class="sub-tab-row absorb" id="absorptionTabs">
        <button type="button" class="active" data-absorption="sodium">ナトリウム</button>
        <button type="button" data-absorption="fraunhofer">フランフォーファー線</button>
      </div>

      <div class="slider-block" id="sliderBlock">
        <label for="lambdaSlider">波長 λ [nm]</label>
        <input type="range" id="lambdaSlider" min="380" max="780" step="1" value="550">
        <div class="slider-val" id="lambdaVal">λ = 550 nm</div>
        <div class="color-name" id="colorName">緑</div>
      </div>

      <div class="line-list" id="lineList"></div>

      <div class="insight-box" id="insightBox">波長が短いほど紫側、長いほど赤側の色になります。</div>
    </section>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("lightCanvas");
      var ctx = canvas.getContext("2d");
      var lambdaSlider = document.getElementById("lambdaSlider");
      var lambdaVal = document.getElementById("lambdaVal");
      var colorName = document.getElementById("colorName");
      var insightBox = document.getElementById("insightBox");
      var colorTable = document.getElementById("colorTable");
      var modeBand = document.getElementById("modeBand");
      var modeSpectrum = document.getElementById("modeSpectrum");
      var modePrism = document.getElementById("modePrism");
      var modeEmission = document.getElementById("modeEmission");
      var modeAbsorption = document.getElementById("modeAbsorption");
      var emissionTabs = document.getElementById("emissionTabs");
      var absorptionTabs = document.getElementById("absorptionTabs");
      var sliderBlock = document.getElementById("sliderBlock");
      var lineList = document.getElementById("lineList");

      var wavelength = 550;
      var mode = "band";
      var emissionKey = "hydrogen";
      var absorptionKey = "sodium";
      var prismT = 0;
      var cw = 0;
      var ch = 0;

      // 明線スペクトル（発光線）
      var EMISSION_SPECTRA = {
        hydrogen: {
          title: "水素（H）",
          desc: "バルマー系列 — 656 nm 付近の赤（Hα）が最も目立つ。",
          lines: [
            { nm: 656.3, label: "Hα", strength: 1 },
            { nm: 486.1, label: "Hβ", strength: 0.88 },
            { nm: 434.0, label: "Hγ", strength: 0.72 },
            { nm: 410.2, label: "Hδ", strength: 0.58 },
            { nm: 397.0, label: "Hε", strength: 0.48 }
          ]
        },
        mercury: {
          title: "水銀の蒸気（Hg）",
          desc: "546 nm の緑線と 577・579 nm の黄線が特徴的。",
          lines: [
            { nm: 404.7, label: "紫", strength: 0.55 },
            { nm: 435.8, label: "青", strength: 0.72 },
            { nm: 546.1, label: "緑", strength: 1 },
            { nm: 577.0, label: "黄", strength: 0.78 },
            { nm: 579.1, label: "黄", strength: 0.76 },
            { nm: 623.4, label: "赤", strength: 0.5 }
          ]
        },
        sodium: {
          title: "ナトリウムの蒸気（Na）",
          desc: "589 nm 付近の二重線（D₁・D₂）がはっきり見える。",
          lines: [
            { nm: 589.0, label: "D₂", strength: 1 },
            { nm: 589.6, label: "D₁", strength: 0.96 }
          ]
        }
      };

      // 吸収スペクトル（暗線）
      var ABSORPTION_SPECTRA = {
        sodium: {
          title: "ナトリウム（Na）",
          desc: "連続スペクトル上に 589 nm 付近の暗線（D線）が現れる。",
          lines: [
            { nm: 589.0, label: "D₂", strength: 1 },
            { nm: 589.6, label: "D₁", strength: 0.95 }
          ]
        },
        fraunhofer: {
          title: "フランフォーファー線（太陽スペクトル）",
          desc: "太陽の大気が吸収した代表的な暗線。C=Hα, D=Na, F=Hβ など。",
          lines: [
            { nm: 393.4, label: "K", strength: 0.82 },
            { nm: 396.8, label: "H", strength: 0.72 },
            { nm: 430.8, label: "G", strength: 0.62 },
            { nm: 486.1, label: "F", strength: 0.68 },
            { nm: 527.0, label: "E", strength: 0.52 },
            { nm: 589.0, label: "D₂", strength: 0.88 },
            { nm: 589.6, label: "D₁", strength: 0.92 },
            { nm: 656.3, label: "C", strength: 0.85 }
          ]
        }
      };

      var COLOR_RANGES = [
        { name: "紫", min: 380, max: 450 },
        { name: "青", min: 450, max: 495 },
        { name: "緑", min: 495, max: 570 },
        { name: "黄", min: 570, max: 590 },
        { name: "橙", min: 590, max: 620 },
        { name: "赤", min: 620, max: 780 }
      ];

      function fitCanvas() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var rect = canvas.getBoundingClientRect();
        cw = rect.width || 600;
        ch = rect.height || 280;
        canvas.width = Math.floor(cw * dpr);
        canvas.height = Math.floor(ch * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // 波長 λ [nm] → RGB（可視光の簡易モデル）
      function wavelengthToRGB(lambda) {
        var r = 0;
        var g = 0;
        var b = 0;
        if (lambda < 380 || lambda > 780) return { r: 0, g: 0, b: 0 };

        if (lambda < 450) {
          r = (450 - lambda) / 70;
          g = 0;
          b = 1;
        } else if (lambda < 495) {
          r = 0;
          g = (lambda - 450) / 45;
          b = 1;
        } else if (lambda < 570) {
          r = (lambda - 495) / 75;
          g = 1;
          b = 1 - (lambda - 495) / 75;
        } else if (lambda < 590) {
          r = 1;
          g = 1 - (lambda - 570) / 20 * 0.35;
          b = 0;
        } else if (lambda < 620) {
          r = 1;
          g = 0.65 - (lambda - 590) / 30 * 0.45;
          b = 0;
        } else {
          r = 1;
          g = Math.max(0, 0.2 - (lambda - 620) / 160 * 0.2);
          b = 0;
        }

        var fade = 1;
        if (lambda < 420) fade = 0.3 + 0.7 * (lambda - 380) / 40;
        if (lambda > 700) fade = 0.3 + 0.7 * (780 - lambda) / 80;

        var gamma = 0.85;
        r = Math.round(255 * Math.pow(r * fade, gamma));
        g = Math.round(255 * Math.pow(g * fade, gamma));
        b = Math.round(255 * Math.pow(b * fade, gamma));
        return { r: r, g: g, b: b };
      }

      function rgbStr(c) {
        return "rgb(" + c.r + "," + c.g + "," + c.b + ")";
      }

      function colorNameFromLambda(lambda) {
        for (var i = 0; i < COLOR_RANGES.length; i++) {
          var r = COLOR_RANGES[i];
          if (lambda >= r.min && lambda < r.max) return r.name;
          if (i === COLOR_RANGES.length - 1 && lambda >= r.min && lambda <= r.max) return r.name;
        }
        if (lambda >= 620) return "赤";
        return "—";
      }

      function updateTableHighlight() {
        var rows = colorTable.querySelectorAll("tbody tr");
        rows.forEach(function (row) {
          var min = parseInt(row.getAttribute("data-min"), 10);
          var max = parseInt(row.getAttribute("data-max"), 10);
          var active = wavelength >= min && (wavelength < max || max === 780);
          row.classList.toggle("active", active);
        });
      }

      function lambdaToX(lambda) {
        var x0 = cw * 0.06;
        var x1 = cw * 0.94;
        return x0 + ((lambda - 380) / 400) * (x1 - x0);
      }

      function drawSpectrumBar(y, h, showMarker) {
        var x0 = cw * 0.06;
        var x1 = cw * 0.94;
        var w = x1 - x0;
        for (var i = 0; i <= w; i++) {
          var lam = 380 + (400 * i) / w;
          ctx.fillStyle = rgbStr(wavelengthToRGB(lam));
          ctx.fillRect(x0 + i, y, 1, h);
        }
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.strokeRect(x0, y, w, h);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "600 10px Inter, sans-serif";
        ctx.fillText("380 nm", x0, y + h + 14);
        ctx.fillText("780 nm", x1 - 32, y + h + 14);

        if (showMarker) {
          var mx = lambdaToX(wavelength);
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(mx, y - 6);
          ctx.lineTo(mx, y + h + 6);
          ctx.stroke();
          ctx.fillStyle = "#fde68a";
          ctx.font = "700 11px Inter, sans-serif";
          ctx.fillText(wavelength + " nm", mx + 4, y - 10);
        }
      }

      // 明線スペクトル — 黒背景に発光線
      function drawEmissionMode() {
        var spec = EMISSION_SPECTRA[emissionKey];
        var barY = ch * 0.62;
        var barH = 22;
        var plotTop = ch * 0.14;
        var plotBot = barY - 18;

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "600 14px Noto Sans JP, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("明線スペクトル — " + spec.title, cw * 0.5, ch * 0.08);

        // 黒い観察面
        ctx.fillStyle = "#0a0a0a";
        ctx.fillRect(cw * 0.06, plotTop, cw * 0.88, plotBot - plotTop);
        ctx.strokeStyle = "rgba(148,163,184,0.25)";
        ctx.strokeRect(cw * 0.06, plotTop, cw * 0.88, plotBot - plotTop);

        spec.lines.forEach(function (line) {
          var x = lambdaToX(line.nm);
          var c = wavelengthToRGB(line.nm);
          var lw = 2 + line.strength * 3;
          ctx.strokeStyle = rgbStr(c);
          ctx.shadowColor = rgbStr(c);
          ctx.shadowBlur = 8 + line.strength * 14;
          ctx.lineWidth = lw;
          ctx.beginPath();
          ctx.moveTo(x, plotTop + 8);
          ctx.lineTo(x, plotBot - 8);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          ctx.font = "600 9px Inter, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(line.label, x, plotTop + 20);
          ctx.fillStyle = "#94a3b8";
          ctx.font = "500 8px Inter, sans-serif";
          ctx.fillText(line.nm.toFixed(1), x, plotBot - 4);
        });

        drawSpectrumBar(barY, barH, false);
        ctx.textAlign = "left";
      }

      // 吸収スペクトル — 連続光に暗線
      function drawAbsorptionMode() {
        var spec = ABSORPTION_SPECTRA[absorptionKey];
        var barY = ch * 0.58;
        var barH = ch * 0.28;
        var x0 = cw * 0.06;
        var x1 = cw * 0.94;
        var w = x1 - x0;

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "600 14px Noto Sans JP, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("吸収スペクトル — " + spec.title, cw * 0.5, ch * 0.08);

        // 連続スペクトル
        for (var i = 0; i <= w; i++) {
          var lam = 380 + (400 * i) / w;
          ctx.fillStyle = rgbStr(wavelengthToRGB(lam));
          ctx.fillRect(x0 + i, barY, 1, barH);
        }

        // 吸収暗線
        spec.lines.forEach(function (line) {
          var x = lambdaToX(line.nm);
          var gap = 3 + line.strength * 5;
          ctx.fillStyle = "#000";
          ctx.fillRect(x - gap * 0.5, barY - 2, gap, barH + 4);
          ctx.strokeStyle = "rgba(0,0,0,0.6)";
          ctx.lineWidth = 1;
          ctx.strokeRect(x - gap * 0.5, barY - 2, gap, barH + 4);
          ctx.fillStyle = "#bae6fd";
          ctx.font = "600 9px Inter, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(line.label, x, barY - 8);
          ctx.fillStyle = "#64748b";
          ctx.font = "500 8px Inter, sans-serif";
          ctx.fillText(line.nm.toFixed(1), x, barY + barH + 14);
        });

        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.strokeRect(x0, barY, w, barH);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "600 10px Inter, sans-serif";
        ctx.fillText("380 nm", x0, barY + barH + 28);
        ctx.textAlign = "right";
        ctx.fillText("780 nm", x1, barY + barH + 28);
        ctx.textAlign = "left";
      }

      function formatLineList(lines) {
        return lines.map(function (l) {
          return "<strong>" + l.label + "</strong> " + l.nm.toFixed(1) + " nm";
        }).join(" · ");
      }

      function drawBandMode() {
        var c = wavelengthToRGB(wavelength);
        var bandY = ch * 0.38;
        var bandH = ch * 0.24;
        var bandX = cw * 0.08;
        var bandW = cw * 0.84;

        ctx.fillStyle = rgbStr(c);
        ctx.shadowColor = rgbStr(c);
        ctx.shadowBlur = 28;
        ctx.fillRect(bandX, bandY, bandW, bandH);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 2;
        ctx.strokeRect(bandX, bandY, bandW, bandH);

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "600 13px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("λ = " + wavelength + " nm  ·  " + colorNameFromLambda(wavelength), cw * 0.5, bandY - 16);

        drawSpectrumBar(ch * 0.72, 18, true);
      }

      function drawSpectrumMode() {
        drawSpectrumBar(ch * 0.35, ch * 0.22, true);
        ctx.fillStyle = "#cbd5e1";
        ctx.font = "600 14px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("可視光スペクトル 380 – 780 nm", cw * 0.5, ch * 0.22);
      }

      // プリズム：白色光 → 波長ごとに屈折角を変えて分解
      function drawPrismMode(t) {
        var px = cw * 0.22;
        var py = ch * 0.42;
        var size = Math.min(cw, ch) * 0.14;

        // 入射白光
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cw * 0.04, py);
        ctx.lineTo(px - size * 0.6, py);
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "600 11px Inter, sans-serif";
        ctx.fillText("白色光", cw * 0.04, py - 10);

        // プリズム（三角）
        ctx.beginPath();
        ctx.moveTo(px, py - size);
        ctx.lineTo(px + size * 1.1, py + size * 0.55);
        ctx.lineTo(px - size * 0.2, py + size * 0.55);
        ctx.closePath();
        var pg = ctx.createLinearGradient(px, py - size, px + size, py);
        pg.addColorStop(0, "rgba(255,255,255,0.25)");
        pg.addColorStop(1, "rgba(200,200,255,0.15)");
        ctx.fillStyle = pg;
        ctx.fill();
        ctx.strokeStyle = "rgba(196,181,253,0.8)";
        ctx.lineWidth = 2;
        ctx.stroke();

        var progress = 0.5 + 0.5 * Math.sin(t * 1.2);
        var baseX = px + size * 1.2;
        var baseY = py + size * 0.1;

        // 短波長ほど屈折大 → 上方向へ
        for (var lam = 780; lam >= 380; lam -= 4) {
          var bend = (780 - lam) / 400;
          var angle = 0.15 + bend * 0.55 * progress;
          var len = cw * 0.38;
          var ex = baseX + Math.cos(angle) * len;
          var ey = baseY - Math.sin(angle) * len * 0.85;
          ctx.strokeStyle = rgbStr(wavelengthToRGB(lam));
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.55 + 0.45 * progress;
          ctx.beginPath();
          ctx.moveTo(baseX, baseY);
          ctx.lineTo(ex, ey);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        drawSpectrumBar(ch * 0.78, 16, true);
        ctx.fillStyle = "#ddd6fe";
        ctx.font = "600 12px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("短波長（紫）ほど屈折角が大きい", cw * 0.58, ch * 0.12);

        // 現在の λ を強調
        var cb = wavelengthToRGB(wavelength);
        ctx.strokeStyle = rgbStr(cb);
        ctx.lineWidth = 3;
        var bendSel = (780 - wavelength) / 400;
        var angSel = 0.15 + bendSel * 0.55 * progress;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX + Math.cos(angSel) * cw * 0.38, baseY - Math.sin(angSel) * cw * 0.32);
        ctx.stroke();
      }

      function syncControls() {
        wavelength = parseInt(lambdaSlider.value, 10);
        var c = wavelengthToRGB(wavelength);
        var name = colorNameFromLambda(wavelength);
        lambdaVal.textContent = "λ = " + wavelength + " nm";
        colorName.textContent = name;
        colorName.style.color = rgbStr(c);
        updateTableHighlight();

        if (mode === "prism") {
          insightBox.innerHTML = "プリズムモード — 白色光が波長ごとに分かれます。現在 <strong>" + wavelength + " nm（" + name + "）</strong> を強調表示。";
          lineList.innerHTML = "";
        } else if (mode === "spectrum") {
          insightBox.innerHTML = "スペクトルバー — 380〜780 nm の連続色。白線が現在の λ = <strong>" + wavelength + " nm</strong>。";
          lineList.innerHTML = "";
        } else if (mode === "emission") {
          var es = EMISSION_SPECTRA[emissionKey];
          insightBox.innerHTML = es.desc + " 発光線：" + es.lines.map(function (l) {
            return l.label + " " + l.nm.toFixed(1) + " nm";
          }).join(" · ");
          lineList.innerHTML = "発光線：" + formatLineList(es.lines);
        } else if (mode === "absorption") {
          var as = ABSORPTION_SPECTRA[absorptionKey];
          insightBox.innerHTML = as.desc;
          lineList.innerHTML = "吸収線（暗線）：" + formatLineList(as.lines);
        } else {
          insightBox.innerHTML = "λ = " + wavelength + " nm → <strong>" + name + "</strong>。短い波長ほど紫、長いほど赤。";
          lineList.innerHTML = "";
        }
      }

      function setEmissionTab(key) {
        emissionKey = key;
        emissionTabs.querySelectorAll("button").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-emission") === key);
        });
        syncControls();
      }

      function setAbsorptionTab(key) {
        absorptionKey = key;
        absorptionTabs.querySelectorAll("button").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-absorption") === key);
        });
        syncControls();
      }

      function setMode(m) {
        mode = m;
        modeBand.classList.toggle("active", m === "band");
        modeSpectrum.classList.toggle("active", m === "spectrum");
        modePrism.classList.toggle("active", m === "prism");
        modeEmission.classList.toggle("active", m === "emission");
        modeAbsorption.classList.toggle("active", m === "absorption");
        emissionTabs.classList.toggle("visible", m === "emission");
        absorptionTabs.classList.toggle("visible", m === "absorption");
        sliderBlock.classList.toggle("hidden", m === "emission" || m === "absorption");
        syncControls();
      }

      function render() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, cw, ch);
        ctx.textAlign = "left";

        if (mode === "band") drawBandMode();
        else if (mode === "spectrum") drawSpectrumMode();
        else if (mode === "emission") drawEmissionMode();
        else if (mode === "absorption") drawAbsorptionMode();
        else drawPrismMode(prismT);
      }

      lambdaSlider.addEventListener("input", function () {
        syncControls();
      });

      modeBand.addEventListener("click", function () { setMode("band"); });
      modeSpectrum.addEventListener("click", function () { setMode("spectrum"); });
      modePrism.addEventListener("click", function () { setMode("prism"); });
      modeEmission.addEventListener("click", function () { setMode("emission"); });
      modeAbsorption.addEventListener("click", function () { setMode("absorption"); });

      emissionTabs.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setEmissionTab(btn.getAttribute("data-emission"));
        });
      });
      absorptionTabs.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setAbsorptionTab(btn.getAttribute("data-absorption"));
        });
      });
      window.addEventListener("resize", fitCanvas);

      fitCanvas();
      syncControls();

      var last = 0;
      function loop(ts) {
        if (!last) last = ts;
        var dt = (ts - last) / 1000;
        last = ts;
        if (mode === "prism") prismT += dt;
        render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
