<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>21章 静電気 — クーロンの法則</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --accent: #818cf8;
      --accent-light: #a5b4fc;
      --panel: rgba(10, 12, 28, 0.9);
      --border: rgba(129, 140, 248, 0.28);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --pos: #f87171;
      --neg: #38bdf8;
    }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans JP", sans-serif;
      background: linear-gradient(165deg, #030712 0%, #0f1030 45%, #0a1628 100%);
      color: var(--text);
      min-height: 100dvh;
      padding: max(10px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
    }
    .page-shell {
      width: min(980px, 96vw);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .page-header { text-align: center; }
    .hero-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(129,140,248,0.45), rgba(248,113,113,0.35));
      border: 1px solid rgba(129,140,248,0.4);
      font-size: 1.3rem;
    }
    h2 { margin: 6px 0 4px; font-weight: 600; color: var(--accent-light); }
    .chapter-label { margin: 0; font-size: 0.82rem; color: var(--muted); }
    #back {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 16px;
      color: #e0e7ff;
      background: rgba(129,140,248,0.14);
      border: 1px solid rgba(129,140,248,0.38);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
    }
    section.panel {
      border-radius: 14px;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
    }
    section.panel h3 { margin: 0 0 10px; font-size: 1.05rem; color: var(--accent-light); }
    section.panel p { font-size: 0.88rem; line-height: 1.75; color: #cbd5e1; margin: 0; }
    .formula-box {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(129,140,248,0.08);
      border: 1px solid rgba(129,140,248,0.22);
      font-size: 0.88rem;
      color: #c7d2fe;
      text-align: center;
    }
    .formula-live {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(129,140,248,0.2);
      font-size: 0.86rem;
      color: #fde68a;
      line-height: 1.65;
      text-align: center;
    }
    .canvas-wrap {
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
      background: #020617;
      border: 1px solid rgba(129,140,248,0.22);
    }
    .canvas-wrap canvas {
      display: block;
      width: 100%;
      height: min(540px, 60dvh);
      min-height: 360px;
      cursor: grab;
    }
    .canvas-wrap canvas:active { cursor: grabbing; }
    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 8px;
      font-size: 0.76rem;
      color: var(--muted);
    }
    .param-grid {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }
    @media (min-width: 640px) {
      .param-grid { grid-template-columns: repeat(3, 1fr); }
    }
    label { display: block; font-size: 0.84rem; color: #cbd5e1; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .slider-val { font-size: 0.82rem; font-weight: 700; color: #c7d2fe; font-variant-numeric: tabular-nums; }
    .toggle-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .toggle-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(129,140,248,0.3);
      background: rgba(15,30,45,0.6);
      color: #cbd5e1;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-btn.is-active {
      background: rgba(129,140,248,0.22);
      border-color: rgba(129,140,248,0.55);
      color: #e0e7ff;
    }
    .readout-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    @media (min-width: 640px) {
      .readout-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .readout {
      padding: 10px;
      border-radius: 10px;
      background: rgba(129,140,248,0.06);
      border: 1px solid rgba(129,140,248,0.16);
    }
    .readout dt { margin: 0; font-size: 0.72rem; color: var(--muted); }
    .readout dd { margin: 4px 0 0; font-size: 0.88rem; font-weight: 700; color: #eef2ff; }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div class="hero-icon" aria-hidden="true">⚡</div>
      <p class="chapter-label">第21章 — 静電気</p>
      <h2>クーロンの法則と帯電</h2>
      <a id="back" href="00_folder_electromagnetism.html#chapter-21">← 電磁気フォルダへ戻る</a>
    </header>

    <section class="panel">
      <h3>クーロン力（高校物理）</h3>
      <p>
        原子は<strong>原子核（陽子＋中性子）</strong>と<strong>電子</strong>からなります。帯電は電子の移動で起こり、
        2点の電荷間の力は <strong>F = k|q₁q₂|/r²</strong>（k ≈ 9.0×10⁹ N·m²/C²）です。
        同符号は反発、異符号は引力です。
      </p>
      <div class="formula-box">F = k · |q₁ q₂| / r² · 同符号 → 反発 · 異符号 → 引力</div>
    </section>

    <section class="panel">
      <h3>シミュレーション</h3>
      <div class="toggle-row">
        <button type="button" class="toggle-btn is-active" id="btnAtom">原子モデル ON</button>
        <button type="button" class="toggle-btn is-active" id="btnField">電場線 ON</button>
      </div>

      <div class="param-grid">
        <div>
          <label for="q1Slider">電荷 q₁ <span class="slider-val" id="q1Val">+3.0 μC</span></label>
          <input type="range" id="q1Slider" min="-100" max="100" value="30" step="5">
        </div>
        <div>
          <label for="q2Slider">電荷 q₂ <span class="slider-val" id="q2Val">−3.0 μC</span></label>
          <input type="range" id="q2Slider" min="-100" max="100" value="-30" step="5">
        </div>
        <div>
          <label for="rSlider">距離 r <span class="slider-val" id="rVal">180 px</span></label>
          <input type="range" id="rSlider" min="10" max="300" value="180" step="5">
        </div>
      </div>

      <div class="readout-grid">
        <dl class="readout"><dt>力 F</dt><dd id="readF">—</dd></dl>
        <dl class="readout"><dt>方向</dt><dd id="readDir">—</dd></dl>
        <dl class="readout"><dt>物体A</dt><dd id="readA">—</dd></dl>
        <dl class="readout"><dt>物体B</dt><dd id="readB">—</dd></dl>
      </div>
      <div class="formula-live" id="formulaLive">—</div>

      <div class="canvas-wrap">
        <canvas id="simCanvas" aria-label="静電気・クーロン力シミュレーション"></canvas>
      </div>
      <div class="legend-row">
        <span style="color:#f87171">＋</span> 正電荷
        <span style="color:#38bdf8">−</span> 負電荷
        <span style="color:#a3e635">→</span> 力の矢印
        <span style="color:#c084fc">〜</span> 電場線
      </div>
    </section>
  </div>

  <script>
    (function () {
      "use strict";

      const K = 8.99e9;
      const canvas = document.getElementById("simCanvas");
      const ctx = canvas.getContext("2d");
      const formulaLive = document.getElementById("formulaLive");

      let q1uC = 3;
      let q2uC = -3;
      let distPx = 180;
      let showAtom = true;
      let showField = true;
      let phase = 0;

      let canvasW = 800;
      let canvasH = 500;

      // 電荷位置（ドラッグ可能）
      let c1 = { x: 0, y: 0 };
      let c2 = { x: 0, y: 0 };
      let dragTarget = null;

      function qToC(qu) { return qu * 1e-6; }

      function formatQ(qu) {
        const s = qu >= 0 ? "+" : "";
        return s + qu.toFixed(1) + " μC";
      }

      function coulombForceN() {
        const rM = Math.max(distPx * 0.01, 0.05);
        return K * Math.abs(qToC(q1uC) * qToC(q2uC)) / (rM * rM);
      }

      function isRepulsive() {
        return q1uC * q2uC > 0;
      }

      function syncChargePositions() {
        const cy = canvasH * 0.62;
        c1.x = canvasW * 0.5 - distPx / 2;
        c2.x = canvasW * 0.5 + distPx / 2;
        c1.y = cy;
        c2.y = cy;
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width < 10) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        canvasW = rect.width;
        canvasH = rect.height;
        syncChargePositions();
      }

      // ─── 原子モデル ───
      function drawAtom(cx, cy, scale, chargeState) {
        const rN = 14 * scale;
        ctx.fillStyle = "rgba(251,191,36,0.9)";
        ctx.beginPath();
        ctx.arc(cx, cy, rN, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#94a3b8";
        ctx.font = "600 " + Math.round(8 * scale) + "px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("n⁰", cx - 6, cy + 3);
        ctx.fillStyle = "#fca5a5";
        ctx.fillText("+p", cx + 6, cy + 3);

        const nEle = chargeState === "pos" ? 2 : chargeState === "neg" ? 5 : 3;
        for (let i = 0; i < nEle; i++) {
          const ang = phase * 1.2 + (i / nEle) * Math.PI * 2;
          const er = 28 * scale;
          const ex = cx + Math.cos(ang) * er;
          const ey = cy + Math.sin(ang) * er * 0.65;
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.arc(ex, ey, 4 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#7dd3fc";
          ctx.font = "600 " + Math.round(7 * scale) + "px Inter, sans-serif";
          ctx.fillText("e⁻", ex, ey - 6 * scale);
        }
      }

      function drawAtomStrip() {
        if (!showAtom) return;
        const y0 = canvasH * 0.02;
        ctx.fillStyle = "rgba(15,23,42,0.5)";
        ctx.fillRect(0, y0, canvasW, canvasH * 0.32);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "600 10px Inter, Noto Sans JP, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("原子：陽子(+) · 中性子(n⁰) · 電子(e⁻) — 中性では陽子数＝電子数", canvasW / 2, canvasH * 0.12);
        drawAtom(canvasW * 0.35, canvasH * 0.18, 0.9, "neutral");
        drawAtom(canvasW * 0.65, canvasH * 0.18, 0.9, "pos");
        ctx.fillStyle = "#cbd5e1";
        ctx.fillText("中性", canvasW * 0.35, canvasH * 0.28);
        ctx.fillStyle = "#fca5a5";
        ctx.fillText("正に帯電（e⁻不足）", canvasW * 0.65, canvasH * 0.28);
      }
      function fieldAt(x, y) {
        const charges = [{ q: qToC(q1uC), x: c1.x, y: c1.y }, { q: qToC(q2uC), x: c2.x, y: c2.y }];
        let ex = 0, ey = 0;
        charges.forEach((c) => {
          if (Math.abs(c.q) < 1e-12) return;
          const dx = x - c.x;
          const dy = y - c.y;
          const r2 = dx * dx + dy * dy;
          const r = Math.sqrt(r2);
          if (r < 12) return;
          const eMag = K * c.q / r2;
          ex += eMag * (dx / r);
          ey += eMag * (dy / r);
        });
        return { ex, ey };
      }

      // ─── 電場線 ───
      function drawFieldLines() {
        if (!showField) return;
        const seeds = [];
        const nLines = 10;
        [c1, c2].forEach((c, idx) => {
          const qu = idx === 0 ? q1uC : q2uC;
          if (Math.abs(qu) < 0.05) return;
          for (let i = 0; i < nLines; i++) {
            const ang = (i / nLines) * Math.PI * 2;
            const sx = c.x + Math.cos(ang) * 18;
            const sy = c.y + Math.sin(ang) * 18;
            seeds.push({ x: sx, y: sy, sign: qu > 0 ? 1 : -1 });
          }
        });

        ctx.strokeStyle = "rgba(192,132,252,0.45)";
        ctx.lineWidth = 1;
        seeds.forEach((s) => {
          let x = s.x, y = s.y;
          ctx.beginPath();
          ctx.moveTo(x, y);
          for (let step = 0; step < 55; step++) {
            const f = fieldAt(x, y);
            const mag = Math.hypot(f.ex, f.ey);
            if (mag < 1e-6) break;
            const dir = s.sign > 0 ? 1 : -1;
            const dx = (f.ex / mag) * dir * 5;
            const dy = (f.ey / mag) * dir * 5;
            x += dx;
            y += dy;
            if (x < 0 || x > canvasW || y < canvasH * 0.35 || y > canvasH) break;
            if (Math.hypot(x - c1.x, y - c1.y) < 16 || Math.hypot(x - c2.x, y - c2.y) < 16) break;
            ctx.lineTo(x, y);
          }
          ctx.stroke();
        });
      }

      // ─── 電荷の描画 ───
      function drawCharge(c, qu, label) {
        const pos = qu >= 0;
        const col = pos ? "#f87171" : "#38bdf8";
        const glow = pos ? "rgba(248,113,113,0.35)" : "rgba(56,189,248,0.35)";
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 18px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(pos ? "+" : "−", c.x, c.y + 1);
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = col;
        ctx.font = "700 11px Inter, Noto Sans JP, sans-serif";
        ctx.fillText(label, c.x, c.y + 34);
        ctx.fillText(formatQ(qu), c.x, c.y + 48);
      }

      // ─── クーロン力の矢印 ───
      function drawForceArrows() {
        const F = coulombForceN();
        const rep = isRepulsive();
        const arrowLen = Math.min(90, Math.max(12, Math.log10(F + 1) * 28));
        const dir1 = rep ? -1 : (q1uC * q2uC < 0 ? (q1uC > 0 ? 1 : -1) : -1);
        const dir2 = rep ? 1 : (q1uC * q2uC < 0 ? (q2uC > 0 ? 1 : -1) : 1);

        function arrow(x, y, dx, len, col) {
          const x2 = x + dx * len;
          ctx.strokeStyle = col;
          ctx.fillStyle = col;
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x2, y);
          ctx.stroke();
          const ah = 8;
          ctx.beginPath();
          ctx.moveTo(x2, y);
          ctx.lineTo(x2 - dx * ah, y - 5);
          ctx.lineTo(x2 - dx * ah, y + 5);
          ctx.closePath();
          ctx.fill();
        }

        const col = rep ? "#a3e635" : "#fb923c";
        if (Math.abs(q1uC) > 0.05 && Math.abs(q2uC) > 0.05) {
          arrow(c1.x, c1.y - 38, dir1, arrowLen, col);
          arrow(c2.x, c2.y - 38, dir2, arrowLen, col);
        }

        ctx.strokeStyle = "rgba(148,163,184,0.5)";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(c1.x, c1.y);
        ctx.lineTo(c2.x, c2.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "600 10px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("r = " + distPx + " px", (c1.x + c2.x) / 2, c1.y + 62);
      }

      function updateReadouts() {
        const F = coulombForceN();
        const rM = distPx * 0.01;
        const rep = isRepulsive();
        document.getElementById("readF").textContent = F >= 0.01 ? F.toExponential(2) + " N" : F.toFixed(4) + " N";
        document.getElementById("readDir").textContent = rep ? "反発 ↔" : "引力 →←";
        document.getElementById("readDir").style.color = rep ? "#a3e635" : "#fb923c";
        document.getElementById("readA").textContent = formatQ(q1uC);
        document.getElementById("readA").style.color = q1uC >= 0 ? "#f87171" : "#38bdf8";
        document.getElementById("readB").textContent = formatQ(q2uC);
        document.getElementById("readB").style.color = q2uC >= 0 ? "#f87171" : "#38bdf8";

        formulaLive.innerHTML =
          "<strong>F = k|q₁q₂|/r²</strong> = 8.99×10⁹ × |" + q1uC + "×10⁻⁶ × " + q2uC + "×10⁻⁶| / "
          + "(" + rM.toFixed(2) + ")² ≈ <strong>" + F.toExponential(2) + " N</strong><br>"
          + (rep ? "同符号 → <strong>反発</strong>" : "異符号 → <strong>引力</strong>")
          + " · 電場線：正→外向き · 負→内向き";
      }

      function drawScene() {
        if (canvasW < 10) return;
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvasW, canvasH);

        drawAtomStrip();
        drawFieldLines();
        drawForceArrows();
        drawCharge(c1, q1uC, "q₁");
        drawCharge(c2, q2uC, "q₂");

        ctx.fillStyle = "#64748b";
        ctx.font = "600 10px Inter, Noto Sans JP, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("電荷をドラッグして移動 · r スライダーでも距離変更", 12, canvasH - 10);

        updateReadouts();
      }

      function loop() {
        phase += 0.05;
        distPx = Math.max(40, Math.hypot(c2.x - c1.x, c2.y - c1.y));
        document.getElementById("rVal").textContent = Math.round(distPx) + " px";
        document.getElementById("rSlider").value = Math.min(300, Math.max(10, Math.round(distPx)));
        drawScene();
        requestAnimationFrame(loop);
      }

      function canvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function pickCharge(p) {
        if (Math.hypot(p.x - c1.x, p.y - c1.y) < 26) return 1;
        if (Math.hypot(p.x - c2.x, p.y - c2.y) < 26) return 2;
        return null;
      }

      canvas.addEventListener("mousedown", (e) => {
        const p = canvasPos(e);
        dragTarget = pickCharge(p);
      });
      canvas.addEventListener("mousemove", (e) => {
        if (!dragTarget) return;
        const p = canvasPos(e);
        if (dragTarget === 1) {
          c1.x = Math.max(40, Math.min(c2.x - 40, p.x));
          c1.y = Math.max(canvasH * 0.4, Math.min(canvasH * 0.85, p.y));
        } else {
          c2.x = Math.max(c1.x + 40, Math.min(canvasW - 40, p.x));
          c2.y = Math.max(canvasH * 0.4, Math.min(canvasH * 0.85, p.y));
        }
      });
      window.addEventListener("mouseup", () => { dragTarget = null; });

      document.getElementById("btnAtom").addEventListener("click", () => {
        showAtom = !showAtom;
        const b = document.getElementById("btnAtom");
        b.textContent = showAtom ? "原子モデル ON" : "原子モデル OFF";
        b.classList.toggle("is-active", showAtom);
      });
      document.getElementById("btnField").addEventListener("click", () => {
        showField = !showField;
        const b = document.getElementById("btnField");
        b.textContent = showField ? "電場線 ON" : "電場線 OFF";
        b.classList.toggle("is-active", showField);
      });

      document.getElementById("q1Slider").addEventListener("input", (e) => {
        q1uC = +e.target.value / 10;
        document.getElementById("q1Val").textContent = formatQ(q1uC);
      });
      document.getElementById("q2Slider").addEventListener("input", (e) => {
        q2uC = +e.target.value / 10;
        document.getElementById("q2Val").textContent = formatQ(q2uC);
      });
      document.getElementById("rSlider").addEventListener("input", (e) => {
        distPx = +e.target.value;
        syncChargePositions();
      });

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
