<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>角度とラジアン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "Poppins", "Noto Sans JP", sans-serif;
      background: linear-gradient(135deg, #e8f4ff, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #003366;
      padding: max(12px, env(safe-area-inset-top)) 0 max(16px, env(safe-area-inset-bottom));
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      min-height: 100dvh;
    }

    h2 {
      margin-top: 16px;
      font-weight: 600;
      color: #004c99;
      text-shadow: 0 0 8px #aee0ff;
    }

    .chapter-label {
      margin: 4px 0 0;
      font-size: 0.82rem;
      color: #4a7099;
    }

    .page-header {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #back {
      margin-top: 10px;
      padding: 10px 16px;
      background: #00aaff;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 0 10px #66d0ff;
      -webkit-tap-highlight-color: transparent;
    }

    #ui {
      width: min(520px, 92vw);
      margin: 10px;
      padding: 15px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0, 100, 200, 0.15);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      height: 28px;
    }

    .formula-box {
      margin: 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 140, 220, 0.08);
      font-size: 0.86rem;
      font-weight: 600;
      color: #004c99;
      text-align: center;
      line-height: 1.55;
    }

    .hint {
      margin: 0;
      font-size: 0.82rem;
      color: #4a7099;
      line-height: 1.55;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-row button {
      flex: 1;
      min-width: 120px;
      padding: 14px 10px;
      min-height: 48px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #animBtn {
      background: #00aaff;
      color: white;
      border: none;
      box-shadow: 0 0 10px #66d0ff;
    }

    #resetBtn {
      background: rgba(255, 255, 255, 0.75);
      color: #004c99;
      border: 2px solid rgba(0, 170, 255, 0.35);
    }

    .canvas-wrap {
      width: min(520px, 92vw);
      height: min(420px, 52dvh);
      min-height: 280px;
      margin: 8px 0 16px;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border-radius: 16px;
      background: white;
      touch-action: none;
      box-shadow: 0 0 16px rgba(0, 150, 255, 0.25);
    }

    .legend {
      width: min(520px, 92vw);
      margin: 0 0 16px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.45);
      font-size: 0.82rem;
      line-height: 1.8;
      color: #4a7099;
    }

    .legend span { font-weight: 600; }
  </style>
</head>
<body>
  <div class="page-header">
    <h2>角度とラジアン</h2>
    <p class="chapter-label">8章　等速円運動 — 弧度法</p>
    <a id="back" href="index.html">← ホームへ戻る</a>
  </div>

  <div id="ui">
    <label>
      半径 r (px):
      <input id="rSlider" type="range" min="50" max="200" step="1" value="120">
      <span id="rValue">120</span>
    </label>
    <label>
      角度 θ (°):
      <input id="thetaSlider" type="range" min="0" max="360" step="0.5" value="57.3">
      <span id="thetaValue">57.3</span>
    </label>

    <p class="formula-box">θ(rad) = θ(°) × π/180　　s = r × θ(rad)</p>
    <p class="hint">弧の長さ s が半径 r と等しくなる角度が <strong>1 rad ≈ 57.3°</strong> です。</p>

    <div class="btn-row">
      <button id="animBtn" type="button">アニメーション</button>
      <button id="resetBtn" type="button">リセット</button>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="legend">
    <span style="color:#0088dd">■ 青：弧 s</span>　
    <span style="color:#cc1133">■ 赤：1 rad の位置（≈57.3°）</span>　
    1 rad のとき s = r
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const canvasWrap = document.getElementById("canvasWrap");
    const animBtn = document.getElementById("animBtn");

    const ONE_RAD_DEG = 180 / Math.PI;
    const ONE_RAD_HIGHLIGHT = 2.5;
    const MAX_DT = 1 / 30;
    const ANIM_SPEED = 45;

    const DEFAULTS = { r: 120, theta: 57.3 };

    let rPx = DEFAULTS.r;
    let thetaDeg = DEFAULTS.theta;
    let animating = false;

    function fmt(n, d) { return Number(n).toFixed(d); }

    function getR() { return parseFloat(document.getElementById("rSlider").value); }
    function getThetaDeg() {
      return animating ? thetaDeg : parseFloat(document.getElementById("thetaSlider").value);
    }

    function syncSliders() {
      document.getElementById("rValue").textContent = fmt(getR(), 0);
      document.getElementById("thetaValue").textContent = fmt(getThetaDeg(), 1);
    }

    function degToRad(deg) { return deg * Math.PI / 180; }

    function isNearOneRad(deg) {
      return Math.abs(deg - ONE_RAD_DEG) <= ONE_RAD_HIGHLIGHT;
    }

    function resetSimulation() {
      animating = false;
      thetaDeg = DEFAULTS.theta;
      document.getElementById("rSlider").value = DEFAULTS.r;
      document.getElementById("thetaSlider").value = DEFAULTS.theta;
      document.getElementById("thetaSlider").disabled = false;
      document.getElementById("rSlider").disabled = false;
      animBtn.textContent = "アニメーション";
      syncSliders();
    }

    function toggleAnimation() {
      if (animating) {
        animating = false;
        document.getElementById("thetaSlider").disabled = false;
        document.getElementById("rSlider").disabled = false;
        animBtn.textContent = "アニメーション";
        document.getElementById("thetaSlider").value = thetaDeg;
        syncSliders();
        return;
      }
      animating = true;
      thetaDeg = 0;
      document.getElementById("thetaSlider").disabled = true;
      document.getElementById("rSlider").disabled = true;
      animBtn.textContent = "停止";
    }

    function update(dt) {
      if (!animating) return;
      thetaDeg += ANIM_SPEED * dt;
      if (thetaDeg >= 360) thetaDeg -= 360;
      syncSliders();
    }

    function resizeCanvas() {
      const rect = canvasWrap.getBoundingClientRect();
      const w = Math.max(280, Math.round(rect.width));
      const h = Math.max(240, Math.round(rect.height));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    function drawInfoPanel(r, thetaD, thetaR, s, nearOne) {
      const pad = 14;
      const boxW = Math.min(220, canvas.width - 28);
      const boxH = 118;
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.strokeStyle = nearOne ? "rgba(204,17,51,0.55)" : "rgba(0,140,220,0.25)";
      ctx.lineWidth = nearOne ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.roundRect(pad, pad, boxW, boxH, 12);
      ctx.fill();
      ctx.stroke();

      ctx.font = "600 12px Inter, Noto Sans JP, sans-serif";
      ctx.fillStyle = nearOne ? "#cc1133" : "#004c99";
      ctx.fillText(nearOne ? "★ ここが 1 rad ★" : "リアルタイム表示", pad + 12, pad + 20);

      ctx.font = "500 12px Inter, Noto Sans JP, sans-serif";
      ctx.fillStyle = "#003366";
      const lines = [
        `角度 θ = ${fmt(thetaD, 1)} °`,
        `ラジアン θ = ${fmt(thetaR, 4)} rad`,
        `半径 r = ${fmt(r, 0)} px`,
        `弧の長さ s = ${fmt(s, 1)} px`,
      ];
      lines.forEach((line, i) => {
        ctx.fillText(line, pad + 12, pad + 40 + i * 18);
      });
    }

    function draw() {
      resizeCanvas();
      const w = canvas.width;
      const h = canvas.height;
      const r = getR();
      const thetaD = getThetaDeg();
      const thetaR = degToRad(thetaD);
      const s = r * thetaR;
      const nearOne = isNearOneRad(thetaD);

      const cx = w * 0.5;
      const cy = h * 0.52;
      const maxR = Math.min(w, h) * 0.38;
      const drawR = Math.min(r, maxR);

      ctx.fillStyle = "#f8fcff";
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(0,100,180,0.12)";
      ctx.lineWidth = 1;
      for (let i = 0; i < w; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, h);
        ctx.stroke();
      }
      for (let j = 0; j < h; j += 40) {
        ctx.beginPath();
        ctx.moveTo(0, j);
        ctx.lineTo(w, j);
        ctx.stroke();
      }

      ctx.strokeStyle = "rgba(0,100,180,0.25)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, drawR, 0, Math.PI * 2);
      ctx.stroke();

      const oneRadAng = -Math.PI / 2 + degToRad(ONE_RAD_DEG);
      const ox = cx + drawR * Math.cos(-Math.PI / 2);
      const oy = cy + drawR * Math.sin(-Math.PI / 2);
      const oneX = cx + drawR * Math.cos(oneRadAng);
      const oneY = cy + drawR * Math.sin(oneRadAng);

      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = "#cc1133";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(oneX, oneY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#cc1133";
      ctx.beginPath();
      ctx.arc(oneX, oneY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "600 11px Inter, Noto Sans JP, sans-serif";
      ctx.fillText("1 rad", oneX + 8, oneY - 4);

      const startAng = -Math.PI / 2;
      const endAng = startAng + thetaR;

      if (thetaR > 0.001) {
        ctx.fillStyle = nearOne ? "rgba(204,17,51,0.22)" : "rgba(0,136,221,0.18)";
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, drawR, startAng, endAng);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = nearOne ? "#cc1133" : "#0088dd";
        ctx.lineWidth = nearOne ? 5 : 4;
        ctx.beginPath();
        ctx.arc(cx, cy, drawR, startAng, endAng);
        ctx.stroke();

        const midAng = startAng + thetaR * 0.5;
        const labelR = drawR + 18;
        const lx = cx + labelR * Math.cos(midAng);
        const ly = cy + labelR * Math.sin(midAng);
        ctx.font = "700 12px Inter, Noto Sans JP, sans-serif";
        ctx.fillStyle = nearOne ? "#cc1133" : "#0066aa";
        ctx.textAlign = "center";
        ctx.fillText(`s = ${fmt(s, 1)}`, lx, ly);
        ctx.textAlign = "left";
      }

      ctx.strokeStyle = "#4a7099";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(ox, oy);
      ctx.stroke();
      ctx.fillStyle = "#4a7099";
      ctx.font = "500 10px Inter, Noto Sans JP, sans-serif";
      ctx.fillText("0°", ox + 6, oy - 4);

      const rx = cx + drawR * Math.cos(endAng);
      const ry = cy + drawR * Math.sin(endAng);
      ctx.strokeStyle = nearOne ? "#cc1133" : "#0088dd";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(rx, ry);
      ctx.stroke();
      ctx.fillStyle = nearOne ? "#cc1133" : "#0088dd";
      ctx.beginPath();
      ctx.arc(rx, ry, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "600 11px Inter, Noto Sans JP, sans-serif";
      ctx.fillText(`${fmt(thetaD, 1)}°`, rx + 8, ry + (endAng > -Math.PI / 2 ? 12 : -4));

      ctx.fillStyle = "#223344";
      ctx.font = "700 12px Inter, Noto Sans JP, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("O", cx - 14, cy + 4);
      ctx.textAlign = "left";
      ctx.font = "500 11px Inter, Noto Sans JP, sans-serif";
      ctx.fillStyle = "#4a7099";
      ctx.fillText(`r = ${fmt(drawR, 0)} px`, cx + drawR * 0.45, cy - 6);

      drawInfoPanel(drawR, thetaD, thetaR, s, nearOne);
    }

    document.getElementById("rSlider").addEventListener("input", () => {
      if (!animating) syncSliders();
    });
    document.getElementById("thetaSlider").addEventListener("input", () => {
      if (!animating) syncSliders();
    });
    animBtn.addEventListener("click", (e) => {
      e.preventDefault();
      toggleAnimation();
    });
    document.getElementById("resetBtn").addEventListener("click", (e) => {
      e.preventDefault();
      resetSimulation();
    });

    window.addEventListener("resize", () => draw());
    if (window.visualViewport) window.visualViewport.addEventListener("resize", () => draw());
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(() => draw()).observe(canvasWrap);
    }

    resetSimulation();

    let lastTime = 0;
    function loop(t) {
      const dt = Math.min((t - lastTime) / 1000, MAX_DT);
      lastTime = t;
      if (dt > 0) update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
