<label>

      <span id="xValue">1.20</span>

    <label>

    <label>

    <p class="formula-box">
      F = −k x　　U = ½ k x²　　K = ½ m v²　　U + K = 一定
    </p>

    <p class="hint">
      x = 0 が自然長（つり合い位置）。x をずらしてから「離す」と、バネが縮みながら U が K に変わります。

<div id="statusPanel">x を設定して「離す」</div>

  <script>
    const layout = { w: 0, h: 0, dpr: 1 };

    function resizeOneHiDPI(targetCanvas, wrap, layout, minH) {
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const w = Math.max(280, Math.round(rect.width));
      const h = Math.max(minH, Math.round(rect.height));
      const pw = Math.round(w * dpr);
      const ph = Math.round(h * dpr);
      if (targetCanvas.width !== pw || targetCanvas.height !== ph) {
        targetCanvas.width = pw;
        targetCanvas.height = ph;
      }
      if (layout) {
        layout.w = w; layout.h = h; layout.dpr = dpr;
        const c = targetCanvas.getContext("2d");
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.imageSmoothingEnabled = true;
      }
      return { w, h, dpr };
    }

    function drawDarkBg(c, w, h) {
      const bg = c.createLinearGradient(0, 0, w, h * 0.9);
      bg.addColorStop(0, "#070b12");
      bg.addColorStop(0.5, "#0c1218");
      bg.addColorStop(1, "#121820");
      c.fillStyle = bg;
      c.fillRect(0, 0, w, h);
      const glow = c.createRadialGradient(w * 0.45, h * 0.48, 0, w * 0.45, h * 0.5, Math.max(w, h) * 0.55);
      glow.addColorStop(0, "rgba(245, 158, 11, 0.08)");
      glow.addColorStop(0.45, "rgba(56, 189, 248, 0.04)");
      glow.addColorStop(1, "rgba(10, 14, 20, 0)");
      c.fillStyle = glow;
      c.fillRect(0, 0, w, h);
      c.strokeStyle = "rgba(148, 163, 184, 0.04)";
      c.lineWidth = 1;
      for (let gx = 0; gx < w; gx += 40) {
        c.beginPath(); c.moveTo(gx, 0); c.lineTo(gx, h); c.stroke();
      }
      for (let gy = 0; gy < h; gy += 40) {
        c.beginPath(); c.moveTo(0, gy); c.lineTo(w, gy); c.stroke();
      }
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const canvasWrap = document.getElementById("canvasWrap");
    const statusPanel = document.getElementById("statusPanel");
    const xSlider = document.getElementById("xSlider");
    const kSlider = document.getElementById("kSlider");
    const mSlider = document.getElementById("mSlider");

    const MAX_DT = 1 / 30;
    const X_MIN = -2;
    const X_MAX = 2;
    const MARGIN = { left: 88, right: 128, top: 44, bottom: 56 };
    const E_MAX_REF = 0.5 * 200 * 4;
    const COL = { u: "#38bdf8", k: "#34d399", e: "#a78bfa", spring: "#f59e0b", force: "#fb923c", track: "#64748b" };

    let x = 1.2;
    let v = 0;
    let simK = 80;
    let simM = 2;
    let E0 = 0;
    let oscillating = false;
    let running = false;
    let paused = false;
    let xTrail = [];

    const DEFAULTS = { x: 1.2, k: 80, m: 2 };

    function fmt(n, d) {
      return Number(n).toFixed(d);
    }

    function getK() {
      return oscillating ? simK : parseFloat(kSlider.value);
    }

    function getM() {
      return oscillating ? simM : parseFloat(mSlider.value);
    }

    function getU() {
      return 0.5 * getK() * x * x;
    }

    function getKEnergy() {
      if (!oscillating && !running) return 0;
      return Math.max(0, E0 - getU());
    }

    function getForce() {
      return -getK() * x;
    }

    function syncSliders() {
      if (!oscillating) x = parseFloat(xSlider.value);
      document.getElementById("xValue").textContent = fmt(x, 2);
      document.getElementById("kValue").textContent = fmt(parseFloat(kSlider.value), 0);
      document.getElementById("mValue").textContent = fmt(parseFloat(mSlider.value), 1);
    }

    function setSlidersEnabled(on) {
      xSlider.disabled = !on;
      kSlider.disabled = !on;
      mSlider.disabled = !on;
    }

    function resetSimulation() {
      xSlider.value = DEFAULTS.x;
      kSlider.value = DEFAULTS.k;
      mSlider.value = DEFAULTS.m;
      x = DEFAULTS.x;
      v = 0;
      simK = DEFAULTS.k;
      simM = DEFAULTS.m;
      E0 = 0.5 * simK * x * x;
      oscillating = false;
      running = false;
      paused = false;
      xTrail = [];
      setSlidersEnabled(true);
      syncSliders();
      statusPanel.textContent = "x を設定して「離す」";
      statusPanel.className = "";
    }

    function releaseSpring() {
      if (oscillating && running && !paused) return;
      if (!oscillating) {
        x = parseFloat(xSlider.value);
        if (Math.abs(x) < 0.05) {
          statusPanel.textContent = "|x| > 0 の位置で「離す」してください";
          statusPanel.className = "";
          return;
        }
        simK = parseFloat(kSlider.value);
        simM = parseFloat(mSlider.value);
        E0 = 0.5 * simK * x * x;
        v = 0;
        xTrail = [];
        oscillating = true;
        setSlidersEnabled(false);
      }
      running = true;
      paused = false;
      syncSliders();
    }

    function pauseSimulation() {
      if (!running) return;
      paused = !paused;
      statusPanel.textContent = paused ? "一時停止中" : "運動中 — U が K に変わっています";
    }

    function resizeCanvas() {
      resizeOneHiDPI(canvas, canvasWrap, layout, 220);
    }

    xSlider.addEventListener("input", () => {
      if (!oscillating) {
        x = parseFloat(xSlider.value);
        E0 = 0.5 * getK() * x * x;
      }
      syncSliders();
    });
    [kSlider, mSlider].forEach((s) => {
      s.addEventListener("input", () => {
        if (!oscillating) E0 = 0.5 * getK() * x * x;
        syncSliders();
      });
    });

    document.getElementById("releaseBtn").addEventListener("click", (e) => {
      e.preventDefault();
      releaseSpring();
    });
    document.getElementById("pauseBtn").addEventListener("click", (e) => {
      e.preventDefault();
      pauseSimulation();
    });
    document.getElementById("resetBtn").addEventListener("click", (e) => {
      e.preventDefault();
      resetSimulation();
    });

    window.addEventListener("resize", resizeCanvas);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(resizeCanvas).observe(canvasWrap);
    }

    requestAnimationFrame(() => {
      resizeCanvas();
      resetSimulation();
    });

    function update(dt) {
      if (!running || paused || !oscillating) return;
      const k = simK;
      const m = simM;
      const steps = 3;
      const sub = dt / steps;
      for (let i = 0; i < steps; i += 1) {
        const a = (-k * x) / m;
        v += a * sub;
        x += v * sub;
      }
      xTrail.push({ x, t: performance.now() });
      if (xTrail.length > 48) xTrail.shift();
    }

    function layoutMetrics(w, h) {
      const plotLeft = MARGIN.left + 8;
      const plotRight = w - MARGIN.right - 8;
      const plotW = plotRight - plotLeft;
      const cy = h * 0.54;
      const ppm = plotW / (X_MAX - X_MIN);
      const eqX = plotLeft + (-X_MIN / (X_MAX - X_MIN)) * plotW;
      return { plotLeft, plotRight, plotW, cy, ppm, eqX, barTop: MARGIN.top + 4, barH: h - MARGIN.top - MARGIN.bottom - 8 };
    }

    function xToPx(xM, lay) {
      return lay.eqX + xM * lay.ppm;
    }

    function drawEnergyBar(x, yTop, barH, fillVal, color, label, valueJ, maxE) {
      const bw = 34;
      const fill = maxE > 0 ? Math.min(1, fillVal / maxE) : 0;
      const fillH = barH * fill;
      ctx.save();
      ctx.fillStyle = "rgba(8, 12, 24, 0.88)";
      ctx.strokeStyle = "rgba(148, 163, 184, 0.22)";
      ctx.lineWidth = 1;
      roundRect(ctx, x - 8, yTop - 26, bw + 16, barH + 40, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(15, 23, 42, 0.6)";
      roundRect(ctx, x, yTop, bw, barH, 6);
      ctx.fill();
      if (fillH > 1) {
        const grad = ctx.createLinearGradient(0, yTop + barH - fillH, 0, yTop + barH);
        grad.addColorStop(0, color);
        grad.addColorStop(1, "rgba(255,255,255,0.35)");
        ctx.fillStyle = grad;
        ctx.shadowBlur = 14;
        ctx.shadowColor = color;
        roundRect(ctx, x + 2, yTop + barH - fillH + 2, bw - 4, fillH - 2, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = color;
      ctx.font = "700 11px Inter, Noto Sans JP, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x + bw / 2, yTop - 10);
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "600 10px Inter, Noto Sans JP, sans-serif";
      ctx.fillText(`${fmt(valueJ, 1)} J`, x + bw / 2, yTop + barH + 18);
      ctx.textAlign = "start";
      ctx.restore();
    }

    function drawEnergyStack(cx, yTop, barH, U, K, maxE) {
      const bw = 40;
      const x = cx - bw / 2;
      const uFrac = maxE > 0 ? U / maxE : 0;
      const kFrac = maxE > 0 ? K / maxE : 0;
      const uH = barH * uFrac;
      const kH = barH * kFrac;
      ctx.save();
      ctx.fillStyle = "rgba(8, 12, 24, 0.88)";
      ctx.strokeStyle = "rgba(167, 139, 250, 0.45)";
      ctx.lineWidth = 1.5;
      roundRect(ctx, x - 8, yTop - 28, bw + 16, barH + 44, 10);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "rgba(148, 163, 184, 0.15)";
      roundRect(ctx, x, yTop, bw, barH, 6);
      ctx.stroke();
      if (uH > 1) {
        ctx.fillStyle = COL.u;
        ctx.globalAlpha = 0.85;
        roundRect(ctx, x + 2, yTop + barH - uH, bw - 4, uH, 4);
        ctx.fill();
      }
      if (kH > 1) {
        ctx.fillStyle = COL.k;
        ctx.globalAlpha = 0.85;
        roundRect(ctx, x + 2, yTop + barH - uH - kH, bw - 4, kH, 4);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = COL.e;
      ctx.font = "700 11px Inter, Noto Sans JP, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("E = U+K", cx, yTop - 12);
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "600 10px Inter, Noto Sans JP, sans-serif";
      ctx.fillText(`${fmt(U + K, 1)} J`, cx, yTop + barH + 20);
      ctx.textAlign = "start";
      ctx.restore();
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function drawFloor(lay) {
      const y = lay.cy + 28;
      ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lay.plotLeft, y);
      ctx.lineTo(lay.plotRight, y);
      ctx.stroke();
      ctx.fillStyle = "rgba(245, 158, 11, 0.06)";
      ctx.fillRect(lay.plotLeft, y, lay.plotW, lay.cy + 40 - y);
    }

    function drawWall(x, cy) {
      const grad = ctx.createLinearGradient(x - 18, 0, x, 0);
      grad.addColorStop(0, "#334155");
      grad.addColorStop(1, "#475569");
      ctx.fillStyle = grad;
      roundRect(ctx, x - 16, cy - 72, 16, 144, 4);
      ctx.fill();
      ctx.strokeStyle = "rgba(148, 163, 184, 0.3)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      for (let i = -56; i <= 56; i += 18) {
        ctx.strokeStyle = "rgba(15, 23, 42, 0.5)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - 16, cy + i);
        ctx.lineTo(x - 26, cy + i - 8);
        ctx.stroke();
      }
    }

    function drawHorizontalSpring(x1, y, x2, compress) {
      const coils = Math.max(8, Math.round(12 - Math.abs(compress) * 0.8));
      const amp = 9 + Math.min(4, Math.abs(compress) * 0.15);
      const len = Math.max(24, x2 - x1);
      const steps = coils * 2;
      const dx = len / steps;
      ctx.save();
      ctx.shadowBlur = 10;
      ctx.shadowColor = "rgba(245, 158, 11, 0.45)";
      ctx.strokeStyle = COL.spring;
      ctx.lineWidth = 3.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y);
      let px = x1;
      for (let i = 0; i < steps; i += 1) {
        px += dx;
        ctx.lineTo(px, y + (i % 2 === 0 ? amp : -amp));
      }
      ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#fde68a";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    function drawMass(cx, cy, speed) {
      const bw = 62;
      const bh = 40;
      const glow = Math.min(0.35, Math.abs(speed) * 0.04);
      ctx.save();
      if (glow > 0.02) {
        ctx.shadowBlur = 22;
        ctx.shadowColor = COL.k;
      }
      const grad = ctx.createLinearGradient(cx - bw / 2, cy - bh, cx + bw / 2, cy);
      grad.addColorStop(0, "#e0f2fe");
      grad.addColorStop(0.5, "#38bdf8");
      grad.addColorStop(1, "#0284c7");
      roundRect(ctx, cx - bw / 2, cy - bh / 2, bw, bh, 8);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#334155";
      [-18, 18].forEach((dx) => {
        ctx.beginPath();
        ctx.arc(cx + dx, cy + bh / 2 - 2, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
      ctx.restore();
    }

    function drawGlowArrow(x0, y0, dx, dy, color, lw) {
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 4) return;
      ctx.save();
      ctx.shadowBlur = 8;
      ctx.shadowColor = color;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = lw;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x0 + dx, y0 + dy);
      ctx.stroke();
      const ang = Math.atan2(dy, dx);
      const head = Math.min(11, len * 0.3);
      const tx = x0 + dx;
      const ty = y0 + dy;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - head * Math.cos(ang - Math.PI / 7), ty - head * Math.sin(ang - Math.PI / 7));
      ctx.lineTo(tx - head * Math.cos(ang + Math.PI / 7), ty - head * Math.sin(ang + Math.PI / 7));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawTrail(lay) {
      if (xTrail.length < 2) return;
      const now = performance.now();
      for (let i = 0; i < xTrail.length; i += 1) {
        const p = xTrail[i];
        const age = (now - p.t) / 900;
        if (age > 1) continue;
        const alpha = (1 - age) * 0.35;
        const px = xToPx(p.x, lay);
        ctx.fillStyle = `rgba(56, 189, 248, ${alpha})`;
        ctx.beginPath();
        ctx.arc(px, lay.cy, 3 + (1 - age) * 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawHudPanel(lines) {
      const hudW = 210;
      const hudH = 16 + lines.length * 18;
      ctx.fillStyle = "rgba(8, 12, 24, 0.9)";
      ctx.strokeStyle = "rgba(245, 158, 11, 0.28)";
      ctx.lineWidth = 1;
      roundRect(ctx, 12, 12, hudW, hudH, 10);
      ctx.fill();
      ctx.stroke();
      ctx.font = "600 12px Inter, Noto Sans JP, sans-serif";
      lines.forEach((line, i) => {
        ctx.fillStyle = line.color || "#e2e8f0";
        ctx.fillText(line.text, 24, 30 + i * 18);
      });
    }

    function drawScene() {
      const w = layout.w || canvas.width;
      const h = layout.h || canvas.height;
      const lay = layoutMetrics(w, h);
      const U = getU();
      const K = getKEnergy();
      const E = U + K;
      const maxE = Math.max(E0, E_MAX_REF * 0.25, E, 1);
      const boxCx = xToPx(x, lay);
      const boxHalf = 31;
      const wallX = lay.plotLeft - 16;
      const springEnd = boxCx - boxHalf;

      ctx.clearRect(0, 0, w, h);
      drawDarkBg(ctx, w, h);

      drawEnergyBar(22, lay.barTop, lay.barH, U, COL.u, "U 弾性", U, maxE);
      const eCx = w - 50;
      const kX = eCx - 86;
      drawEnergyBar(kX, lay.barTop, lay.barH, K, COL.k, "K 運動", K, maxE);
      drawEnergyStack(eCx, lay.barTop, lay.barH, U, K, maxE);

      ctx.fillStyle = "rgba(8, 12, 24, 0.55)";
      roundRect(ctx, lay.plotLeft, lay.cy - 82, lay.plotW, 164, 12);
      ctx.fill();
      ctx.strokeStyle = "rgba(245, 158, 11, 0.18)";
      ctx.lineWidth = 1;
      ctx.stroke();

      drawFloor(lay);

      ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(lay.eqX, lay.cy - 76);
      ctx.lineTo(lay.eqX, lay.cy + 76);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "600 11px Inter, Noto Sans JP, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("平衡 x = 0", lay.eqX, lay.cy - 84);

      ctx.strokeStyle = "rgba(148, 163, 184, 0.15)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 8; i += 1) {
        const xm = X_MIN + ((X_MAX - X_MIN) * i) / 8;
        const px = xToPx(xm, lay);
        ctx.beginPath();
        ctx.moveTo(px, lay.cy + 58);
        ctx.lineTo(px, lay.cy + 68);
        ctx.stroke();
        if (i % 2 === 0) ctx.fillText(`${fmt(xm, 1)} m`, px, lay.cy + 82);
      }
      ctx.textAlign = "start";

      drawTrail(lay);
      drawWall(wallX, lay.cy);
      if (springEnd > wallX + 10) drawHorizontalSpring(wallX, lay.cy, springEnd, x);
      drawMass(boxCx, lay.cy, v);

      const F = getForce();
      if (Math.abs(F) > 0.5) {
        const fLen = Math.max(-90, Math.min(90, F * 0.5));
        drawGlowArrow(boxCx, lay.cy + 36, fLen, 0, COL.force, 3);
        ctx.fillStyle = COL.force;
        ctx.font = "700 11px Inter, Noto Sans JP, sans-serif";
        ctx.fillText(`F = ${fmt(F, 0)} N`, boxCx + fLen + (fLen > 0 ? 8 : -72), lay.cy + 40);
      }

      if (Math.abs(v) > 0.05 && oscillating) {
        const vLen = Math.max(-80, Math.min(80, v * 14));
        drawGlowArrow(boxCx, lay.cy - 42, vLen, 0, COL.k, 2.5);
      }

      drawHudPanel([
        { text: `k = ${fmt(getK(), 0)} N/m  ·  m = ${fmt(getM(), 1)} kg` },
        { text: `x = ${fmt(x, 2)} m`, color: "#fde68a" },
        { text: `U = ${fmt(U, 1)} J`, color: COL.u },
        { text: `K = ${fmt(K, 1)} J`, color: COL.k },
        { text: `E = ${fmt(E, 1)} J（一定）`, color: COL.e },
      ]);

      if (oscillating && running && !paused) {
        statusPanel.textContent = "運動中 — バネが縮むと U ↓、K ↑（E は一定）";
        statusPanel.className = "motion";
      } else if (oscillating && paused) {
        statusPanel.className = "";
      } else if (!oscillating) {
        statusPanel.textContent = Math.abs(x) > 0.05
          ? `U = ${fmt(U, 1)} J — 「離す」で K に変換`
          : "|x| > 0 の位置で「離す」";
        statusPanel.className = Math.abs(x) > 0.05 ? "ready" : "";
      }
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, MAX_DT);
      last = now;
      update(dt);
      syncSliders();
      drawScene();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
