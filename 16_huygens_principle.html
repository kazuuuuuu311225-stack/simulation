<title>16章 ホイヘンスの原理 — 波面と小波源</title>

    body {

<body>
  <div class="page-shell">
    <header class="page-header">
      <div class="hero-icon">🌊</div>
      <h2>16章 ホイヘンスの原理</h2>
      <p class="chapter-label">波面上の点 → 小波源 → 包絡線が新しい波面</p>
      <a id="back" href="00_folder_waves.html#chapter-16">← 波動 · 第16章</a>
    </header>

    <section class="panel">
      <h3>ホイヘンスの原理</h3>
      <ul>
        <li>波面上の<strong>すべての点</strong>は小さな波源になる</li>
        <li>各点から<strong>円形波</strong>が広がる</li>
        <li>円形波の<strong>包絡線</strong>が次の波面になる</li>
        <li>波の進行 · 回折 · 屈折を説明できる</li>
      </ul>
    </section>

    <section class="panel">
      <h3>シミュレーション</h3>
      <div class="canvas-wrap"><canvas id="waveCanvas"></canvas></div>
      <div class="legend-row">
        <span style="color:#7dd3fc">● 波面上の小波源</span>
        <span style="color:rgba(255,255,255,0.75)">○ 円形波</span>
        <span style="color:#fff">— 包絡線（新波面）</span>
        <span style="color:#fde68a">▮ スリット（回折）</span>
      </div>

      <div class="param-grid">
        <div>
          <label for="speedSlider">波の速さ v</label>
          <input type="range" id="speedSlider" min="40" max="200" step="5" value="100">
          <div class="slider-val" id="speedVal">100 px/s</div>
        </div>
        <div>
          <label for="countSlider">小波源の数 N</label>
          <input type="range" id="countSlider" min="8" max="40" step="1" value="22">
          <div class="slider-val" id="countVal">N = 22</div>
        </div>
        <div>
          <label for="lambdaSlider">波面の間隔 λ</label>
          <input type="range" id="lambdaSlider" min="40" max="140" step="5" value="80">
          <div class="slider-val" id="lambdaVal">λ = 80 px</div>
        </div>
      </div>

      <div class="toggle-row">
        <label><input type="checkbox" id="diffractionToggle"> 回折モード（スリット）</label>
        <label><input type="checkbox" id="refractionToggle"> 屈折モード（下半分で v 低下）</label>
      </div>

      <div class="btn-row">
        <button type="button" id="pauseBtn">一時停止</button>
        <button type="button" id="resetBtn">リセット</button>
      </div>

      <div class="insight-box" id="insightBox">
        波面上の各点から円が広がり、その外側の包絡線が新しい波面になります。
      </div>
    </section>
  </div>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("waveCanvas");
      var ctx = canvas.getContext("2d");
      var speedSlider = document.getElementById("speedSlider");
      var countSlider = document.getElementById("countSlider");
      var lambdaSlider = document.getElementById("lambdaSlider");
      var speedVal = document.getElementById("speedVal");
      var countVal = document.getElementById("countVal");
      var lambdaVal = document.getElementById("lambdaVal");
      var diffractionToggle = document.getElementById("diffractionToggle");
      var refractionToggle = document.getElementById("refractionToggle");
      var pauseBtn = document.getElementById("pauseBtn");
      var resetBtn = document.getElementById("resetBtn");
      var insightBox = document.getElementById("insightBox");

      var waveSpeed = 100;
      var sourceCount = 22;
      var wavelength = 80;
      var diffraction = false;
      var refraction = false;
      var paused = false;

      var simTime = 0;
      var lastTs = 0;
      var frontX = 0;
      var emitAcc = 0;
      var cw = 0;
      var ch = 0;

      // 小波源 { x, y, t0, vLocal }
      var sources = [];
      // 包絡線（新波面）の履歴 [ { points: [{x,y}], t } ]
      var envelopes = [];

      var SLIT_X = 0;
      var SLIT_HALF = 0;
      var BOUNDARY_Y = 0;
      var V_RATIO = 0.55;

      function localSpeed(y) {
        if (refraction && y >= BOUNDARY_Y) return waveSpeed * V_RATIO;
        return waveSpeed;
      }

      function yMargin() {
        return Math.max(48, ch * 0.12);
      }

      function buildFrontPoints(x) {
        var ys = [];
        var y0 = yMargin();
        var y1 = ch - yMargin();
        for (var i = 0; i < sourceCount; i++) {
          var t = sourceCount === 1 ? 0.5 : i / (sourceCount - 1);
          ys.push(y0 + (y1 - y0) * t);
        }
        return ys.map(function (y) { return { x: x, y: y }; });
      }

      function passesSlit(y) {
        if (!diffraction) return true;
        if (frontX < SLIT_X - 2) return true;
        return Math.abs(y - ch * 0.5) <= SLIT_HALF;
      }

      function emitSourcesFromFront(pts, t0) {
        pts.forEach(function (p) {
          if (!passesSlit(p.y)) return;
          sources.push({
            x: p.x,
            y: p.y,
            t0: t0,
            v: localSpeed(p.y)
          });
        });
      }

      function resetSim() {
        simTime = 0;
        lastTs = 0;
        emitAcc = 0;
        sources = [];
        envelopes = [];
        frontX = Math.max(56, cw * 0.1);
        SLIT_X = cw * 0.42;
        SLIT_HALF = ch * 0.055;
        BOUNDARY_Y = ch * 0.52;

        var initPts = buildFrontPoints(frontX);
        emitSourcesFromFront(initPts, 0);
        envelopes.push({ points: initPts.slice(), t: 0 });
        updateInsight();
      }

      function fitCanvas() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var rect = canvas.getBoundingClientRect();
        cw = rect.width || canvas.clientWidth || 600;
        ch = rect.height || canvas.clientHeight || 360;
        canvas.width = Math.floor(cw * dpr);
        canvas.height = Math.floor(ch * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // 包絡線：各 y で最も右側の円弧上の点を取る
      function computeEnvelope(now) {
        var y0 = yMargin();
        var y1 = ch - yMargin();
        var steps = Math.max(sourceCount, 24);
        var pts = [];
        var maxAge = wavelength * 2.2 / waveSpeed;

        for (var j = 0; j <= steps; j++) {
          var y = y0 + (y1 - y0) * (j / steps);
          var bestX = -Infinity;

          for (var i = 0; i < sources.length; i++) {
            var s = sources[i];
            var age = now - s.t0;
            if (age <= 0 || age > maxAge) continue;
            var r = age * s.v;
            var dy = y - s.y;
            if (Math.abs(dy) > r) continue;
            var x = s.x + Math.sqrt(r * r - dy * dy);
            if (x > bestX) bestX = x;
          }

          if (bestX > -Infinity) pts.push({ x: bestX, y: y });
        }
        return pts;
      }

      function drawBackground() {
        var bg = ctx.createLinearGradient(0, 0, cw, ch);
        bg.addColorStop(0, "#060a12");
        bg.addColorStop(1, "#0c1524");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, cw, ch);

        if (refraction) {
          ctx.fillStyle = "rgba(56, 189, 248, 0.06)";
          ctx.fillRect(0, BOUNDARY_Y, cw, ch - BOUNDARY_Y);
          ctx.strokeStyle = "rgba(251, 191, 36, 0.45)";
          ctx.setLineDash([8, 6]);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, BOUNDARY_Y);
          ctx.lineTo(cw, BOUNDARY_Y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(251, 191, 36, 0.85)";
          ctx.font = "600 11px Inter, sans-serif";
          ctx.fillText("媒質境界（下：v 小）", 10, BOUNDARY_Y - 6);
        }

        if (diffraction) {
          var cy = ch * 0.5;
          ctx.fillStyle = "rgba(30, 41, 59, 0.92)";
          ctx.fillRect(SLIT_X - 8, yMargin(), 16, cy - SLIT_HALF - yMargin());
          ctx.fillRect(SLIT_X - 8, cy + SLIT_HALF, 16, ch - yMargin() - (cy + SLIT_HALF));
          ctx.strokeStyle = "rgba(251, 191, 36, 0.7)";
          ctx.lineWidth = 2;
          ctx.strokeRect(SLIT_X - 8, yMargin(), 16, cy - SLIT_HALF - yMargin());
          ctx.strokeRect(SLIT_X - 8, cy + SLIT_HALF, 16, ch - yMargin() - (cy + SLIT_HALF));
          ctx.fillStyle = "rgba(251, 191, 36, 0.9)";
          ctx.font = "600 11px Inter, sans-serif";
          ctx.fillText("スリット", SLIT_X - 14, yMargin() - 6);
        }

        ctx.strokeStyle = "rgba(56, 189, 248, 0.12)";
        ctx.lineWidth = 1;
        for (var gx = 0; gx < cw; gx += 40) {
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.lineTo(gx, ch);
          ctx.stroke();
        }
        for (var gy = 0; gy < ch; gy += 40) {
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(cw, gy);
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(148, 163, 184, 0.7)";
        ctx.font = "600 12px Inter, sans-serif";
        ctx.fillText("→ 波の進行", cw - 88, 22);
      }

      function drawWavelets(now) {
        var maxAge = wavelength * 2.5 / waveSpeed;
        var i = 0;
        while (i < sources.length) {
          var s = sources[i];
          var age = now - s.t0;
          if (age > maxAge + 0.5) {
            sources.splice(i, 1);
            continue;
          }
          var r = age * s.v;
          if (r < 1) { i++; continue; }

          var alpha = Math.max(0.12, Math.min(0.55, 0.5 - age / (maxAge * 1.2)));
          ctx.beginPath();
          ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255, 255, 255, " + alpha + ")";
          ctx.lineWidth = 1.2;
          ctx.stroke();
          i++;
        }
      }

      function drawFrontPoints(pts) {
        pts.forEach(function (p) {
          if (!passesSlit(p.y)) return;
          var g = ctx.createRadialGradient(p.x - 2, p.y - 2, 0, p.x, p.y, 7);
          g.addColorStop(0, "#ffffff");
          g.addColorStop(0.4, "#7dd3fc");
          g.addColorStop(1, "rgba(56, 189, 248, 0.2)");
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        });
      }

      function drawEnvelopeLine(pts, alpha, width) {
        if (pts.length < 2) return;
        ctx.save();
        ctx.lineJoin = "round";
        ctx.lineCap = "round";

        var grad = ctx.createLinearGradient(pts[0].x, 0, pts[pts.length - 1].x, 0);
        grad.addColorStop(0, "rgba(56, 189, 248, 0.9)");
        grad.addColorStop(0.5, "rgba(186, 230, 253, 0.95)");
        grad.addColorStop(1, "rgba(255, 255, 255, 1)");

        ctx.strokeStyle = grad;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = width;
        ctx.shadowColor = "rgba(255,255,255,0.6)";
        ctx.shadowBlur = width > 2 ? 10 : 4;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (var k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255,255,255," + Math.min(1, alpha + 0.15) + ")";
        ctx.lineWidth = Math.max(1, width * 0.35);
        ctx.shadowBlur = 0;
        ctx.stroke();
        ctx.restore();
      }

      function updateInsight() {
        if (diffraction && refraction) {
          insightBox.innerHTML = "スリット通過後に円形波が広がり（回折）、下半分では v が小さいため波面が曲がります（屈折）。";
        } else if (diffraction) {
          insightBox.innerHTML = "スリットを通った点だけが小波源になり、後方で波面が<strong>広がって</strong>回折します。";
        } else if (refraction) {
          insightBox.innerHTML = "下半分で円の広がりが遅いため、包絡線（波面）が<strong>曲がり</strong>屈折します。";
        } else {
          insightBox.innerHTML = "波面上の各点から円形波が広がり、その<strong>包絡線</strong>（白い太線）が次の波面になります。";
        }
      }

      function step(dt) {
        if (paused) return;

        simTime += dt;
        frontX += waveSpeed * dt;
        emitAcc += dt;

        var emitPeriod = wavelength / waveSpeed;
        if (emitAcc >= emitPeriod) {
          emitAcc -= emitPeriod;
          var pts = buildFrontPoints(frontX);
          emitSourcesFromFront(pts, simTime);
          var env = computeEnvelope(simTime);
          if (env.length > 3) envelopes.push({ points: env, t: simTime });
          if (envelopes.length > 8) envelopes.shift();
        }

        if (frontX > cw + 40) {
          frontX = Math.max(56, cw * 0.08);
          emitAcc = 0;
        }
      }

      function render() {
        drawBackground();
        drawWavelets(simTime);

        for (var e = 0; e < envelopes.length - 1; e++) {
          drawEnvelopeLine(envelopes[e].points, 0.25, 1.5);
        }

        var currentEnv = computeEnvelope(simTime);
        drawEnvelopeLine(currentEnv, 0.95, 3.5);

        var frontPts = buildFrontPoints(frontX);
        if (frontPts.length > 1) {
          drawEnvelopeLine(frontPts, 0.55, 2);
        }
        drawFrontPoints(frontPts);

        ctx.fillStyle = "rgba(186, 230, 253, 0.85)";
        ctx.font = "600 11px Inter, sans-serif";
        ctx.fillText("t = " + simTime.toFixed(1) + " s", 10, 20);
      }

      function tick(ts) {
        if (!lastTs) lastTs = ts;
        var dt = Math.min((ts - lastTs) / 1000, 0.05);
        lastTs = ts;
        step(dt);
        render();
        requestAnimationFrame(tick);
      }

      function syncControls() {
        waveSpeed = parseInt(speedSlider.value, 10);
        sourceCount = parseInt(countSlider.value, 10);
        wavelength = parseInt(lambdaSlider.value, 10);
        diffraction = diffractionToggle.checked;
        refraction = refractionToggle.checked;
        speedVal.textContent = waveSpeed + " px/s";
        countVal.textContent = "N = " + sourceCount;
        lambdaVal.textContent = "λ = " + wavelength + " px";
        updateInsight();
      }

      speedSlider.addEventListener("input", syncControls);
      countSlider.addEventListener("input", syncControls);
      lambdaSlider.addEventListener("input", syncControls);
      diffractionToggle.addEventListener("change", function () { syncControls(); resetSim(); });
      refractionToggle.addEventListener("change", function () { syncControls(); resetSim(); });

      pauseBtn.addEventListener("click", function () {
        paused = !paused;
        pauseBtn.textContent = paused ? "再開" : "一時停止";
        pauseBtn.classList.toggle("active", paused);
      });

      resetBtn.addEventListener("click", function () {
        syncControls();
        resetSim();
      });

      window.addEventListener("resize", function () {
        fitCanvas();
        resetSim();
      });

      fitCanvas();
      syncControls();
      resetSim();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
