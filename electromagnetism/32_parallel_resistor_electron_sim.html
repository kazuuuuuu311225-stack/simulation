<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../assets/js/physlabo-viewport-inline.js?v=20260810"></script>
<title>並列回路 — 自由電子の流れ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/physlabo-mobile.css?v=20260821">
<style>
    * { box-sizing: border-box; }
    :root {
      --panel: rgba(10, 12, 28, 0.92);
      --border: rgba(56, 189, 248, 0.28);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #bae6fd;
    }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans JP", sans-serif;
      background: linear-gradient(165deg, #030712 0%, #0a1628 45%, #101820 100%);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
    }
    .shell { width: min(940px, 98vw); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 600; color: #bae6fd; text-align: center; }
    .sub { margin: 0; text-align: center; font-size: 0.82rem; color: var(--muted); }
    section.panel {
      border-radius: 14px; padding: 16px 18px;
      background: var(--panel); border: 1px solid var(--border);
    }
    .canvas-wrap {
      border-radius: 12px; overflow: auto; background: #020617;
      border: 1px solid rgba(56, 189, 248, 0.22);
    }
    canvas { display: block; width: 900px; height: 500px; max-width: 100%; }
    .param-grid {
      display: grid; gap: 12px; margin-top: 12px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    label { display: block; font-size: 0.84rem; color: #cbd5e1; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .slider-val { font-size: 0.82rem; font-weight: 700; color: #bae6fd; }
    .readout-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px;
    }
    .readout {
      padding: 10px; border-radius: 10px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.16);
    }
    .readout dt { margin: 0; font-size: 0.72rem; color: var(--muted); }
    .readout dd { margin: 4px 0 0; font-size: 0.95rem; font-weight: 700; color: #fde68a; }
    .formula {
      margin-top: 10px; padding: 10px 12px; border-radius: 10px;
      background: rgba(15,23,42,0.55); border: 1px solid rgba(56,189,248,0.2);
      font-size: 0.84rem; color: #cbd5e1; line-height: 1.65; text-align: center;
    }
    .legend { margin-top: 8px; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <h1>並列回路 — 合成抵抗と自由電子</h1>
    <p class="sub">R1・R2 を並列接続 · 電子は − → +（右方向へ進む · 逆流なし）</p>

    <section class="panel">
      <div class="canvas-wrap">
        <canvas id="canvas" width="900" height="500"></canvas>
      </div>
      <p class="legend">● 青粒 ＝ 自由電子 · 上ルート R1 · 下ルート R2 · 合流点 (600, 250)</p>

      <div class="param-grid">
        <div>
          <label for="r1Slider">R1 <span class="slider-val" id="r1Val">30 Ω</span></label>
          <input type="range" id="r1Slider" min="1" max="100" value="30" step="1">
        </div>
        <div>
          <label for="r2Slider">R2 <span class="slider-val" id="r2Val">20 Ω</span></label>
          <input type="range" id="r2Slider" min="1" max="100" value="20" step="1">
        </div>
        <div>
          <label for="vSlider">V <span class="slider-val" id="vVal">12.0 V</span></label>
          <input type="range" id="vSlider" min="0" max="240" value="120" step="1">
        </div>
      </div>

      <div class="readout-grid">
        <dl class="readout"><dt>合成抵抗 R<sub>total</sub></dt><dd id="readR">—</dd></dl>
        <dl class="readout"><dt>電流 I</dt><dd id="readI">—</dd></dl>
      </div>
      <div class="formula" id="formulaLive">—</div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const formulaLive = document.getElementById("formulaLive");

    const CW = 900, CH = 500;
    const Y_UPPER = 150, Y_LOWER = 350;
    const MERGE = { x: 600, y: 250 };
    const PLUS = { x: 100, y: 250 };
    const MINUS = { x: 800, y: 250 };
    const SPLIT = { x: 180, y: 250 };
    const R_W = 120, R_H = 20;
    const R1_X = 300, R2_X = 300;
    const K_SPEED = 55;
    const MAX_E = 70;

    const electrons = [];
    let lastFrame = performance.now();

    function getR1() { return +document.getElementById("r1Slider").value; }
    function getR2() { return +document.getElementById("r2Slider").value; }
    function getV() { return +document.getElementById("vSlider").value / 10; }

    function getRtotal() {
      const R1 = getR1(), R2 = getR2();
      return (R1 * R2) / (R1 + R2);
    }

    function getI() {
      const Rt = getRtotal();
      return Rt > 0 ? getV() / Rt : 0;
    }

    function getI1() { const V = getV(), R1 = getR1(); return R1 > 0 ? V / R1 : 0; }
    function getI2() { const V = getV(), R2 = getR2(); return R2 > 0 ? V / R2 : 0; }

    function branchProbUpper() {
      const R1 = getR1(), R2 = getR2();
      const g1 = 1 / R1, g2 = 1 / R2;
      return g1 / (g1 + g2);
    }

    function fmtI(I) {
      const a = Math.abs(I);
      if (a >= 1) return I.toFixed(3) + " A";
      if (a >= 1e-3) return (I * 1e3).toFixed(2) + " mA";
      return (I * 1e6).toFixed(1) + " μA";
    }

    function syncUI() {
      document.getElementById("r1Val").textContent = getR1() + " Ω";
      document.getElementById("r2Val").textContent = getR2() + " Ω";
      document.getElementById("vVal").textContent = getV().toFixed(1) + " V";
      const Rt = getRtotal(), I = getI();
      document.getElementById("readR").textContent = Rt.toFixed(2) + " Ω";
      document.getElementById("readI").textContent = fmtI(I);
      const pu = branchProbUpper(), pl = 1 - pu;
      formulaLive.innerHTML =
        "R<sub>total</sub> = R1R2/(R1+R2) = <strong>" + Rt.toFixed(2) + " Ω</strong>"
        + " · I = V/R = <strong>" + fmtI(I) + "</strong>"
        + "<br>分岐：上ルート " + (pu * 100).toFixed(1) + "% · 下ルート " + (pl * 100).toFixed(1) + "%"
        + " · v<sub>d</sub> ∝ I（R↑ → 遅い）";
    }

    function labelText(text, x, y, align) {
      ctx.font = "600 12px Inter, Noto Sans JP, sans-serif";
      ctx.textAlign = align || "left";
      const w = ctx.measureText(text).width + 10;
      const h = 18;
      const lx = align === "center" ? x - w * 0.5 : (align === "right" ? x - w : x);
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.fillRect(lx, y - 13, w, h);
      ctx.fillStyle = "#0f172a";
      ctx.fillText(text, lx + 5, y);
      ctx.textAlign = "left";
    }

    function drawWire(x1, y1, x2, y2) {
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawResistor(x, yCenter, name, R) {
      const y0 = yCenter - R_H * 0.5;
      ctx.fillStyle = "#1e293b";
      ctx.strokeStyle = "#fde68a";
      ctx.lineWidth = 2;
      ctx.fillRect(x, y0, R_W, R_H);
      ctx.strokeRect(x, y0, R_W, R_H);
      labelText(name + " = " + R + " Ω", x + R_W * 0.5, y0 - 10, "center");
    }

    function drawBattery() {
      const cx = PLUS.x, cy = PLUS.y;
      drawWire(cx + 18, cy, SPLIT.x, cy);

      ctx.strokeStyle = "#f87171";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - 6, cy - 18);
      ctx.lineTo(cx - 6, cy + 18);
      ctx.stroke();

      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx + 6, cy - 10);
      ctx.lineTo(cx + 6, cy + 10);
      ctx.stroke();

      labelText("+", cx - 22, cy - 22, "center");
      labelText("V", cx, cy + 32, "center");
    }

    function drawCircuit() {
      ctx.fillStyle = "#050810";
      ctx.fillRect(0, 0, CW, CH);

      drawBattery();

      drawWire(SPLIT.x, SPLIT.y, SPLIT.x, Y_UPPER);
      drawWire(SPLIT.x, SPLIT.y, SPLIT.x, Y_LOWER);

      drawWire(SPLIT.x, Y_UPPER, R1_X, Y_UPPER);
      drawWire(R1_X + R_W, Y_UPPER, MERGE.x, Y_UPPER);
      drawWire(MERGE.x, Y_UPPER, MERGE.x, MERGE.y);

      drawWire(SPLIT.x, Y_LOWER, R2_X, Y_LOWER);
      drawWire(R2_X + R_W, Y_LOWER, MERGE.x, Y_LOWER);
      drawWire(MERGE.x, Y_LOWER, MERGE.x, MERGE.y);

      drawWire(MERGE.x, MERGE.y, MINUS.x, MINUS.y);

      drawResistor(R1_X, Y_UPPER, "R1", getR1());
      drawResistor(R2_X, Y_LOWER, "R2", getR2());

      ctx.fillStyle = "#cbd5e1";
      [ [SPLIT.x, Y_UPPER], [SPLIT.x, Y_LOWER], [MERGE.x, Y_UPPER], [MERGE.x, Y_LOWER], [MERGE.x, MERGE.y] ]
        .forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); });

      labelText("−", MINUS.x + 16, MINUS.y - 22, "center");
      labelText("合流", MERGE.x, MERGE.y - 18, "center");
      labelText("上ルート y=150", 240, Y_UPPER - 28, "center");
      labelText("下ルート y=350", 240, Y_LOWER + 36, "center");
    }

    function spawnElectron() {
      const upper = Math.random() < branchProbUpper();
      electrons.push({
        route: upper ? "upper" : "lower",
        phase: "branch",
        x: SPLIT.x + 8 + Math.random() * 24,
        y: upper ? Y_UPPER : Y_LOWER,
      });
    }

    function syncElectronCount() {
      const I = getI();
      const target = getV() <= 0 ? 0 : Math.min(MAX_E, Math.max(6, Math.round(8 + I * 18)));
      while (electrons.length < target) spawnElectron();
      while (electrons.length > target) electrons.pop();
    }

    function driftSpeed(route) {
      const I = getI();
      if (getV() <= 0 || I <= 0) return 0;
      if (route === "upper") return K_SPEED * getI1();
      if (route === "lower") return K_SPEED * getI2();
      return K_SPEED * I;
    }

    function advanceElectron(e, dt) {
      const jitter = (Math.random() - 0.5) * 0.35;
      const vd = driftSpeed(e.route) * dt;

      if (e.phase === "branch") {
        const dx = Math.max(vd + jitter, 0);
        e.x += dx;
        if (e.x >= MERGE.x) {
          e.x = MERGE.x;
          e.phase = "merge";
        }
        return;
      }

      if (e.phase === "merge") {
        const step = Math.max(vd + Math.abs(jitter) * 0.2, 0);
        if (e.route === "upper") {
          e.y += step;
          if (e.y >= MERGE.y) { e.y = MERGE.y; e.phase = "out"; }
        } else {
          e.y -= step;
          if (e.y <= MERGE.y) { e.y = MERGE.y; e.phase = "out"; }
        }
        return;
      }

      if (e.phase === "out") {
        const dx = Math.max(K_SPEED * getI() * dt + jitter, 0);
        e.x += dx;
        if (e.x >= MINUS.x) {
          const upper = Math.random() < branchProbUpper();
          e.route = upper ? "upper" : "lower";
          e.phase = "branch";
          e.x = SPLIT.x + 8 + Math.random() * 24;
          e.y = upper ? Y_UPPER : Y_LOWER;
        }
      }
    }

    function drawElectrons() {
      electrons.forEach((e) => {
        ctx.fillStyle = "#38bdf8";
        ctx.shadowColor = "#38bdf8";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      syncUI();
      syncElectronCount();
      electrons.forEach((e) => advanceElectron(e, dt));
      drawCircuit();
      drawElectrons();
      requestAnimationFrame(frame);
    }

    ["r1Slider", "r2Slider", "vSlider"].forEach((id) => {
      document.getElementById(id).addEventListener("input", syncUI);
    });

    syncUI();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
