<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ブラウン運動 · 熱運動 — 12章 熱と比熱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header glass">
      <a class="back-link" href="../index.html">← メニューへ</a>
      <p class="chapter-label">12章 · 熱と比熱</p>
      <h1>ブラウン運動 · 熱運動</h1>
      <p class="subtitle">分子の熱運動が大きな粒子をランダムに押し動かす様子を観察できます</p>
    </header>

    <main class="sim-panel glass">
      <div class="canvas-wrap">
        <canvas id="simCanvas" aria-label="熱運動シミュレーション"></canvas>
        <div class="legend">
          <span class="legend-item"><i class="dot dot--small"></i>分子（小粒子）</span>
          <span class="legend-item"><i class="dot dot--large"></i>観察対象（大粒子）</span>
        </div>
      </div>

      <div class="controls">
        <div class="control-row">
          <label for="tempSlider">
            <span class="label-text">温度</span>
            <span class="temp-value"><output id="tempValue">300</output> K</span>
          </label>
          <input type="range" id="tempSlider" min="100" max="600" value="300" step="10">
          <p class="hint">温度が高いほど分子の速度 v が大きくなり、大粒子の動きも激しくなります（v ∝ T）</p>
        </div>

        <button type="button" id="resetBtn" class="reset-btn">再スタート</button>
      </div>
    </main>

    <footer class="footer">
      <p>小粒子は壁で反射し、大粒子には分子からランダムなキックが加わります</p>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
