            <input type="range" id="mSlider" min="10" max="250" value="50" step="1">

            <label for="kmSlider">比例定数 k<sub>m</sub> <span class="slider-val" id="kmVal">1.00</span> <span class="slider-range">（0.1〜8）</span></label>
            <input type="range" id="kmSlider" min="1" max="80" value="10" step="1">

          <dl class="readout"><dt>最寄り磁極まで</dt><dd id="readDist">—</dd></dl>

  <script>
    (function () {
      "use strict";

      const CW = 900, CH = 560, PAD = 20;
      const FILING_STEP = 4;
      const MIN_R2 = 320, MAG_W = 190, MAG_H = 58, POLE_R = 26, POLE_GAP = 210;
      const H_DISPLAY = 1400;

      const canvas = document.getElementById("simCanvas");
      const ctx = canvas.getContext("2d");
      const filingsLayer = document.createElement("canvas");
      filingsLayer.width = CW;
      filingsLayer.height = CH;
      const fctx = filingsLayer.getContext("2d");

      const DEFAULT = {
        magnet: { cx: CW * 0.5, cy: CH * 0.5 },
        probe: { x: CW * 0.5 - 200, y: CH * 0.5 - 90 },
        pair: { cx: CW * 0.5, cy: CH * 0.5 },
      };

      const MISSIONS = [
        { id: "start", text: "白い探針をドラッグして、磁場の強さ |H| を測ってみよう！", check: () => true },
        { id: "near", text: "探針を N極（赤）のすぐそばに置いてみよう → |H| がぐんと大きくなる！", check: (s) => s.nearestDist < 55 && s.hMag > 1.5 },
        { id: "far", text: "探針を画面の端まで遠ざけてみよう → 距離が2倍になると |H| はだいたい¼になる", check: (s) => s.nearestDist > 180 },
        { id: "same", text: "「同極 N・N」に切り替えて、鉄粉が中央で薄くなるのを観察しよう", check: (s) => s.mode === "same" },
        { id: "weak", text: "同極モードで探針を2つの N極のちょうど真ん中に置こう → 磁場が弱いゾーン！", check: (s) => s.mode === "same" && s.nearestDist < 130 && s.hMag < 0.6 },
        { id: "strong", text: "磁石の強さスライダーを最大にして、鉄粉の模様がどう変わるか見てみよう", check: (s) => s.mStrength >= 20 },
      ];

      let mode = "dipole", mStrength = 5, km = 1;
      let showFilings = true, showFlow = true, showHeat = false, showLines = true;
      let magnetCX = DEFAULT.magnet.cx, magnetCY = DEFAULT.magnet.cy;
      let pairCX = DEFAULT.pair.cx, pairCY = DEFAULT.pair.cy;
      let probeX = DEFAULT.probe.x, probeY = DEFAULT.probe.y;
      let dragProbe = false, dragMagnet = false, phase = 0;
      let missionIdx = 0, completedMissions = new Set();
      let cachedLines = [], flowParticles = [], ambientFlow = [];
      let maxFieldCache = 1, dirtyField = true, filingsDirty = true;

      function poles() {
        if (mode === "dipole") {
          return [
            { x: magnetCX - MAG_W * 0.25, y: magnetCY, m: mStrength, label: "N", color: "#ff6b6b", glow: "rgba(255,107,107," },
            { x: magnetCX + MAG_W * 0.25, y: magnetCY, m: -mStrength, label: "S", color: "#38bdf8", glow: "rgba(56,189,248," },
          ];
        }
        return [
          { x: pairCX - POLE_GAP / 2, y: pairCY, m: mStrength, label: "N", color: "#ff6b6b", glow: "rgba(255,107,107," },
          { x: pairCX + POLE_GAP / 2, y: pairCY, m: mStrength, label: "N", color: "#ff6b6b", glow: "rgba(255,107,107," },
        ];
      }

      function fieldRaw(x, y) {
        let hx = 0, hy = 0;
        for (const p of poles()) {
          const dx = x - p.x, dy = y - p.y;
          const r2 = dx * dx + dy * dy + MIN_R2;
          const r = Math.sqrt(r2);
          const s = (km * p.m) / r2;
          hx += s * (dx / r); hy += s * (dy / r);
        }
        const mag = Math.hypot(hx, hy);
        return { hx, hy, mag, angle: Math.atan2(hy, hx) };
      }

      function fieldAt(x, y) {
        const r = fieldRaw(x, y);
        return { hx: r.hx, hy: r.hy, mag: r.mag, angle: r.angle, dispH: r.mag * H_DISPLAY };
      }

      function displayH(mag) { return mag * H_DISPLAY; }

      function insideBody(x, y) {
        if (mode === "dipole") return Math.abs(x - magnetCX) < MAG_W / 2 + 2 && Math.abs(y - magnetCY) < MAG_H / 2 + 2;
        for (const p of poles()) if (Math.hypot(x - p.x, y - p.y) < POLE_R - 2) return true;
        return false;
      }

      function outOfBounds(x, y) { return x < PAD || x > CW - PAD || y < PAD || y > CH - PAD; }

      function nearestPole(x, y) {
        let best = poles()[0], bestD = Infinity;
        for (const p of poles()) {
          const d = Math.hypot(x - p.x, y - p.y);
          if (d < bestD) { bestD = d; best = p; }
        }
        return { pole: best, dist: bestD };
      }

      function nearestSink(x, y) {
        let best = null, bestD = Infinity;
        for (const p of poles()) {
          if (p.m >= 0) continue;
          const d = Math.hypot(x - p.x, y - p.y);
          if (d < bestD) { bestD = d; best = p; }
        }
        return best;
      }

      function traceLine(sx, sy, maxSteps) {
        const pts = [{ x: sx, y: sy }];
        let x = sx, y = sy;
        for (let i = 0; i < maxSteps; i++) {
          const f = fieldRaw(x, y);
          if (f.mag < 0.012) break;
          const step = Math.min(11, 3 + 9 / Math.sqrt(f.mag + 0.15));
          const nx = x + (f.hx / f.mag) * step, ny = y + (f.hy / f.mag) * step;
          const sink = nearestSink(nx, ny);
          if (sink && Math.hypot(nx - sink.x, ny - sink.y) < POLE_R + 4) {
            pts.push({ x: sink.x, y: sink.y }); break;
          }
          if (insideBody(nx, ny)) break;
          if (outOfBounds(nx, ny)) { pts.push({ x: nx, y: ny }); break; }
          x = nx; y = ny; pts.push({ x, y });
        }
        return pts;
      }

      function buildSeeds() {
        const seeds = [], ps = poles();
        const n = Math.max(32, Math.round(28 + mStrength * 3.5));
        ps.forEach((p) => {
          if (p.m <= 0) return;
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2;
            seeds.push({ x: p.x + Math.cos(a) * (POLE_R + 6), y: p.y + Math.sin(a) * (POLE_R + 6) });
          }
          for (let k = 0; k < 8; k++) {
            const a = (k / 8) * Math.PI * 2;
            seeds.push({ x: p.x + Math.cos(a) * (POLE_R + 18), y: p.y + Math.sin(a) * (POLE_R + 18) });
          }
          if (mode === "dipole") {
            for (let j = 0; j < 8; j++) {
              const tx = magnetCX - MAG_W * 0.24 + (j / 7) * MAG_W * 0.48;
              seeds.push({ x: tx, y: magnetCY - MAG_H / 2 - 10 });
              seeds.push({ x: tx, y: magnetCY + MAG_H / 2 + 10 });
            }
          }
        });
        return seeds;
      }

      function initAmbientFlow() {
        ambientFlow = [];
        const cols = Math.max(18, Math.floor(CW / 38));
        const rows = Math.max(11, Math.floor(CH / 38));
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            ambientFlow.push({
              x: ((col + 0.5) / cols) * CW,
              y: ((row + 0.5) / rows) * CH,
              trail: [],
            });
          }
        }
      }

      function respawnAmbient(p) {
        const sources = poles().filter((pole) => pole.m > 0);
        const pole = sources[Math.floor(Math.random() * sources.length)] || poles()[0];
        const a = Math.random() * Math.PI * 2;
        const r = POLE_R + 14 + Math.random() * 50;
        p.x = pole.x + Math.cos(a) * r;
        p.y = pole.y + Math.sin(a) * r;
        p.trail = [];
      }

      function updateAmbientFlow() {
        ambientFlow.forEach((p) => {
          if (insideBody(p.x, p.y)) { respawnAmbient(p); return; }
          const f = fieldRaw(p.x, p.y);
          if (f.mag < 0.006) { respawnAmbient(p); return; }
          const step = 2.5 + 5 / Math.sqrt(f.mag + 0.08);
          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 5) p.trail.shift();
          p.x += (f.hx / f.mag) * step;
          p.y += (f.hy / f.mag) * step;
          if (outOfBounds(p.x, p.y) || p.x < 2 || p.x > CW - 2 || p.y < 2 || p.y > CH - 2) respawnAmbient(p);
        });
      }

      function rebuildFieldCache() {
        cachedLines = [];
        buildSeeds().forEach((seed) => {
          const pts = traceLine(seed.x, seed.y, 300);
          if (pts.length >= 4) cachedLines.push(pts);
        });
        flowParticles = [];
        cachedLines.forEach((pts, li) => {
          const n = 7;
          for (let i = 0; i < n; i++) {
            flowParticles.push({ line: li, t: i / n + Math.random() * 0.15, speed: 0.0035 + Math.random() * 0.004 });
          }
        });
        initAmbientFlow();
        maxFieldCache = 0.1;
        for (let gy = PAD; gy < CH - PAD; gy += 28) {
          for (let gx = PAD; gx < CW - PAD; gx += 28) {
            if (!insideBody(gx, gy)) maxFieldCache = Math.max(maxFieldCache, fieldRaw(gx, gy).mag);
          }
        }
        dirtyField = false;
      }

      function rebuildFilingsLayer() {
        fctx.setTransform(1, 0, 0, 1, 0, 0);
        fctx.clearRect(0, 0, CW, CH);
        fctx.fillStyle = "#5c6378";
        fctx.fillRect(0, 0, CW, CH);

        const cols = Math.floor(CW / FILING_STEP);
        const rows = Math.floor(CH / FILING_STEP);
        fctx.lineCap = "round";

        for (let row = 0; row <= rows; row++) {
          for (let col = 0; col <= cols; col++) {
            const x = col * FILING_STEP + FILING_STEP * 0.5;
            const y = row * FILING_STEP + FILING_STEP * 0.5;
            if (x < 0 || y < 0 || x > CW || y > CH) continue;

            const fld = fieldRaw(x, y);
            const t = Math.pow(Math.min(1, fld.mag / maxFieldCache), 0.28);
            const ang = fld.angle + ((col * 13 + row * 29) % 97) / 97 * 0.18 - 0.09;
            const cos = Math.cos(ang), sin = Math.sin(ang);
            const baseLen = 9;
            const boostLen = t * 14;
            const baseLw = 2;
            const boostLw = t * 2;

            fctx.fillStyle = "rgba(235,240,250,0.95)";
            fctx.beginPath();
            fctx.arc(x, y, 1.4, 0, Math.PI * 2);
            fctx.fill();

            fctx.strokeStyle = "rgba(25,30,40,0.9)";
            fctx.lineWidth = baseLw + 1.5;
            fctx.beginPath();
            fctx.moveTo(x - cos * baseLen * 0.5, y - sin * baseLen * 0.5);
            fctx.lineTo(x + cos * baseLen * 0.5, y + sin * baseLen * 0.5);
            fctx.stroke();

            fctx.strokeStyle = "rgba(250,252,255,0.97)";
            fctx.lineWidth = baseLw;
            fctx.beginPath();
            fctx.moveTo(x - cos * baseLen * 0.5, y - sin * baseLen * 0.5);
            fctx.lineTo(x + cos * baseLen * 0.5, y + sin * baseLen * 0.5);
            fctx.stroke();

            if (boostLen > 1) {
              const total = baseLen + boostLen;
              fctx.strokeStyle = "rgba(255,255,255,1)";
              fctx.lineWidth = baseLw + boostLw;
              fctx.beginPath();
              fctx.moveTo(x - cos * total * 0.5, y - sin * total * 0.5);
              fctx.lineTo(x + cos * total * 0.5, y + sin * total * 0.5);
              fctx.stroke();
            }
          }
        }
        filingsDirty = false;
      }

      function strengthLevel(h) {
        const r = h / maxFieldCache;
        if (r > 0.65) return { label: "超強い 🔥", cls: "warn" };
        if (r > 0.35) return { label: "強い 💪", cls: "good" };
        if (r > 0.12) return { label: "ふつう", cls: "" };
        return { label: "弱いゾーン 🍃", cls: "" };
      }

      function markDirty() { dirtyField = true; filingsDirty = true; }

      /* ---- drawing ---- */

      function drawHeatmap() {
        const cols = 36, rows = 22;
        const gw = CW - PAD * 2, gh = CH - PAD * 2;
        const logMax = Math.log(maxFieldCache + 0.05);
        const dim = showFilings ? 0.15 : 1;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const px = PAD + (col / cols) * gw, py = PAD + (row / rows) * gh;
            if (insideBody(px, py)) continue;
            const h = fieldRaw(px, py).mag;
            const t = Math.min(1, (Math.log(h + 0.05) - Math.log(0.05)) / (logMax - Math.log(0.05)));
            const hue = 240 - t * 200;
            const alpha = (0.06 + t * 0.18) * dim;
            ctx.fillStyle = `hsla(${hue}, 85%, 55%, ${alpha})`;
            ctx.fillRect(px - gw / cols / 2, py - gh / rows / 2, gw / cols + 1, gh / rows + 1);
          }
        }
      }

      function drawFilings() {
        if (filingsDirty) rebuildFilingsLayer();
        ctx.drawImage(filingsLayer, 0, 0, CW, CH);
      }

      function drawFieldLines() {
        cachedLines.forEach((pts, idx) => {
          const alpha = 0.55 + 0.3 * Math.sin(phase + idx * 0.2);
          ctx.strokeStyle = `rgba(253, 224, 71, ${alpha})`;
          ctx.lineWidth = mode === "same" ? 2 : 2.5;
          ctx.shadowColor = "rgba(253,224,71,0.4)";
          ctx.shadowBlur = 4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
          ctx.shadowBlur = 0;
        });
      }

      function drawFlowDot(x, y, radius, bright) {
        const glow = ctx.createRadialGradient(x, y, 0, x, y, radius);
        glow.addColorStop(0, bright ? "rgba(255,255,220,0.98)" : "rgba(253,224,71,0.75)");
        glow.addColorStop(0.35, "rgba(253,224,71,0.45)");
        glow.addColorStop(1, "rgba(253,224,71,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x, y, bright ? 3.5 : 2, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawFlowParticles() {
        updateAmbientFlow();

        ambientFlow.forEach((p) => {
          if (insideBody(p.x, p.y)) return;
          if (p.trail.length > 1) {
            ctx.strokeStyle = "rgba(253,224,71,0.22)";
            ctx.lineWidth = 2;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(p.trail[0].x, p.trail[0].y);
            for (let i = 1; i < p.trail.length; i++) ctx.lineTo(p.trail[i].x, p.trail[i].y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }
          drawFlowDot(p.x, p.y, 7, false);
        });

        flowParticles.forEach((fp) => {
          fp.t += fp.speed;
          if (fp.t > 1) fp.t -= 1;
          const pts = cachedLines[fp.line];
          if (!pts || pts.length < 2) return;
          const idx = fp.t * (pts.length - 1);
          const i0 = Math.floor(idx), i1 = Math.min(i0 + 1, pts.length - 1);
          const f = idx - i0;
          const x = pts[i0].x + (pts[i1].x - pts[i0].x) * f;
          const y = pts[i0].y + (pts[i1].y - pts[i0].y) * f;
          drawFlowDot(x, y, 11, true);
        });
      }

      function drawPoleGlow(p) {
        const pulse = 1 + Math.sin(phase * 2 + p.x * 0.01) * 0.15;
        const r = (POLE_R + 18) * pulse;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, p.glow + "0.35)");
        g.addColorStop(1, p.glow + "0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawMagnet() {
        const x0 = magnetCX - MAG_W / 2, y0 = magnetCY - MAG_H / 2, r = 12;
        poles().forEach(drawPoleGlow);
        const shine = ctx.createLinearGradient(x0, y0, x0, y0 + MAG_H);
        shine.addColorStop(0, "rgba(255,255,255,0.25)");
        shine.addColorStop(0.5, "rgba(255,255,255,0)");
        shine.addColorStop(1, "rgba(0,0,0,0.2)");
        ctx.fillStyle = "rgba(255,107,107,0.95)";
        ctx.beginPath(); ctx.roundRect(x0, y0, MAG_W / 2, MAG_H, [r, 0, 0, r]); ctx.fill();
        ctx.fillStyle = "rgba(56,189,248,0.95)";
        ctx.beginPath(); ctx.roundRect(x0 + MAG_W / 2, y0, MAG_W / 2, MAG_H, [0, r, r, 0]); ctx.fill();
        ctx.fillStyle = shine;
        ctx.fillRect(x0, y0, MAG_W, MAG_H);
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x0 + 1, y0 + 1, MAG_W - 2, MAG_H - 2);
        ctx.fillStyle = "#fff";
        ctx.font = "800 28px Inter, Noto Sans JP, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("N", magnetCX - MAG_W * 0.25, magnetCY);
        ctx.fillText("S", magnetCX + MAG_W * 0.25, magnetCY);
        ctx.textBaseline = "alphabetic";
      }

      function drawPoleDisc(p) {
        drawPoleGlow(p);
        const g = ctx.createRadialGradient(p.x - 5, p.y - 5, 1, p.x, p.y, POLE_R);
        g.addColorStop(0, "#fff");
        g.addColorStop(0.3, p.color);
        g.addColorStop(1, p.color);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, POLE_R, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "800 24px Inter, Noto Sans JP, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(p.label, p.x, p.y);
        ctx.textBaseline = "alphabetic";
      }

      function drawPoles() {
        if (mode === "dipole") drawMagnet();
        else poles().forEach(drawPoleDisc);
      }

      function drawCompass(x, y, angle, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "rgba(15,23,42,0.85)";
        ctx.strokeStyle = "rgba(148,163,184,0.4)";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ff6b6b";
        ctx.beginPath();
        ctx.moveTo(0, -size + 4); ctx.lineTo(-5, 2); ctx.lineTo(5, 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#94a3b8";
        ctx.beginPath();
        ctx.moveTo(0, size - 4); ctx.lineTo(-5, -2); ctx.lineTo(5, -2); ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      function drawProbe(pf) {
        const disp = pf.dispH;
        const len = Math.min(80, 18 + disp * 4);
        const head = Math.max(12, len * 0.28);
        const tipX = probeX + Math.cos(pf.angle) * len, tipY = probeY + Math.sin(pf.angle) * len;
        const baseX = tipX - Math.cos(pf.angle) * head, baseY = tipY - Math.sin(pf.angle) * head;
        const wing = Math.PI / 5;

        ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.shadowColor = "rgba(251,191,36,0.8)"; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.moveTo(probeX, probeY); ctx.lineTo(baseX, baseY); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - head * Math.cos(pf.angle - wing), tipY - head * Math.sin(pf.angle - wing));
        ctx.lineTo(tipX - head * 0.5 * Math.cos(pf.angle), tipY - head * 0.5 * Math.sin(pf.angle));
        ctx.lineTo(tipX - head * Math.cos(pf.angle + wing), tipY - head * Math.sin(pf.angle + wing));
        ctx.closePath(); ctx.fill();

        const pulse = 16 + Math.sin(phase * 4) * 3;
        ctx.strokeStyle = "rgba(167,139,250,0.5)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(probeX, probeY, pulse, 0, Math.PI * 2); ctx.stroke();

        ctx.fillStyle = "#fff"; ctx.strokeStyle = "#818cf8"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(probeX, probeY, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        drawCompass(probeX - 28, probeY + 28, pf.angle, 14);

        const { pole, dist } = nearestPole(probeX, probeY);
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "rgba(148,163,184,0.35)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(probeX, probeY); ctx.lineTo(pole.x, pole.y); ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawBackground() {
        const g = ctx.createRadialGradient(CW / 2, CH / 2, 0, CW / 2, CH / 2, Math.max(CW, CH) * 0.65);
        g.addColorStop(0, "#1e1e2a");
        g.addColorStop(1, "#0a0a0e");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, CW, CH);
      }

      function drawScene() {
        if (dirtyField) rebuildFieldCache();
        if (showFilings && filingsDirty) rebuildFilingsLayer();

        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const bufW = Math.max(1, Math.round(rect.width * dpr));
        const bufH = Math.max(1, Math.round(rect.height * dpr));

        if (canvas.width !== bufW || canvas.height !== bufH) {
          canvas.width = bufW;
          canvas.height = bufH;
        }

        ctx.setTransform(bufW / CW, 0, 0, bufH / CH, 0, 0);

        if (!showFilings) {
          drawBackground();
        }
        if (showHeat) drawHeatmap();
        if (showFilings) drawFilings();
        if (showLines) drawFieldLines();
        if (showFlow) drawFlowParticles();
        drawPoles();

        const pf = fieldAt(probeX, probeY);
        if (!insideBody(probeX, probeY)) drawProbe(pf);
        updateUI(pf);
      }

      function updateMissions(pf) {
        const state = {
          mode, mStrength, hMag: pf.dispH,
          nearestDist: nearestPole(probeX, probeY).dist,
        };
        const cur = MISSIONS[missionIdx];
        if (cur.check(state) && !completedMissions.has(cur.id)) {
          completedMissions.add(cur.id);
          document.getElementById("missionReward").textContent = "✅ クリア！ いい観察だね";
          if (missionIdx < MISSIONS.length - 1) {
            missionIdx++;
            setTimeout(() => {
              document.getElementById("missionReward").textContent = "";
            }, 2000);
          }
        }
        document.getElementById("missionText").textContent = MISSIONS[missionIdx].text;
        document.getElementById("hudMission").textContent = MISSIONS[missionIdx].text;
      }

      function updateUI(pf) {
        const { dist } = nearestPole(probeX, probeY);
        const level = strengthLevel(pf.mag);
        const deg = ((pf.angle * 180) / Math.PI + 360) % 360;
        const hStr = pf.dispH.toFixed(2);

        document.getElementById("readH").textContent = hStr;
        document.getElementById("hudH").textContent = "|H| = " + hStr;
        document.getElementById("hudMeterFill").style.width = (Math.min(1, pf.mag / maxFieldCache) * 100).toFixed(1) + "%";
        document.getElementById("hudLevel").textContent = level.label;
        const lvlEl = document.getElementById("readLevel");
        lvlEl.textContent = level.label;
        lvlEl.className = level.cls;
        document.getElementById("readDist").textContent = dist.toFixed(0) + " px";
        document.getElementById("readAngle").textContent = deg.toFixed(0) + "°";
        document.getElementById("mVal").textContent = mStrength.toFixed(1);
        document.getElementById("kmVal").textContent = km.toFixed(2);
        updateMissions(pf);
      }

      function setProbe(p) {
        probeX = Math.max(PAD, Math.min(CW - PAD, p.x));
        probeY = Math.max(PAD, Math.min(CH - PAD, p.y));
      }

      function canvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (cx - rect.left) * (CW / rect.width),
          y: (cy - rect.top) * (CH / rect.height),
        };
      }

      function onDown(e) {
        const p = canvasPos(e);
        if (Math.hypot(p.x - probeX, p.y - probeY) < 24) {
          dragProbe = true; canvas.classList.add("is-dragging");
        } else if ((mode === "dipole" && insideBody(p.x, p.y)) ||
          (mode === "same" && Math.hypot(p.x - pairCX, p.y - pairCY) < POLE_GAP * 0.5)) {
          dragMagnet = true; canvas.classList.add("is-dragging");
        } else {
          setProbe(p);
        }
      }

      function onMove(e) {
        const p = canvasPos(e);
        if (dragProbe) setProbe(p);
        if (dragMagnet) {
          if (mode === "dipole") {
            magnetCX = Math.max(MAG_W / 2 + PAD, Math.min(CW - MAG_W / 2 - PAD, p.x));
            magnetCY = Math.max(MAG_H / 2 + PAD, Math.min(CH - MAG_H / 2 - PAD, p.y));
          } else {
            pairCX = Math.max(POLE_GAP / 2 + PAD, Math.min(CW - POLE_GAP / 2 - PAD, p.x));
            pairCY = Math.max(POLE_R + PAD, Math.min(CH - POLE_R - PAD, p.y));
          }
          markDirty();
        }
      }

      function onUp() { dragProbe = false; dragMagnet = false; canvas.classList.remove("is-dragging"); }

      canvas.addEventListener("mousedown", onDown);
      canvas.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);
      canvas.addEventListener("touchstart", onDown, { passive: true });
      canvas.addEventListener("touchmove", onMove, { passive: true });
      window.addEventListener("touchend", onUp);

      document.querySelectorAll(".mode-card").forEach((btn) => {
        btn.addEventListener("click", () => {
          mode = btn.dataset.mode;
          document.querySelectorAll(".mode-card").forEach((b) => b.classList.toggle("is-active", b === btn));
          markDirty();
        });
      });

      document.getElementById("btnFilings").addEventListener("click", function () {
        showFilings = !showFilings;
        if (showFilings) filingsDirty = true;
        this.classList.toggle("is-active", showFilings);
        this.textContent = showFilings ? "✨ 鉄粉モード" : "鉄粉 OFF";
      });
      document.getElementById("btnFlow").addEventListener("click", function () {
        showFlow = !showFlow;
        this.classList.toggle("is-active", showFlow);
        this.textContent = showFlow ? "💫 流れアニメ" : "流れ OFF";
      });
      document.getElementById("btnHeat").addEventListener("click", function () {
        showHeat = !showHeat;
        this.classList.toggle("is-active", showHeat);
        this.textContent = showHeat ? "🌡 強さヒートマップ" : "ヒート OFF";
      });
      document.getElementById("btnLines").addEventListener("click", function () {
        showLines = !showLines;
        this.classList.toggle("is-active", showLines);
        this.textContent = showLines ? "〰 磁力線 ON" : "〰 磁力線";
      });

      document.getElementById("mSlider").addEventListener("input", (e) => {
        mStrength = +e.target.value / 10; markDirty();
      });
      document.getElementById("kmSlider").addEventListener("input", (e) => {
        km = +e.target.value / 10; markDirty();
      });

      document.getElementById("btnReset").addEventListener("click", () => {
        magnetCX = DEFAULT.magnet.cx; magnetCY = DEFAULT.magnet.cy;
        pairCX = DEFAULT.pair.cx; pairCY = DEFAULT.pair.cy;
        probeX = DEFAULT.probe.x; probeY = DEFAULT.probe.y;
        missionIdx = 0; completedMissions.clear();
        document.getElementById("missionReward").textContent = "";
        markDirty();
      });

      function ensureFxOn() {
        showFilings = true;
        showFlow = true;
        filingsDirty = true;
        document.getElementById("btnFilings").classList.add("is-active");
        document.getElementById("btnFilings").textContent = "✨ 鉄粉モード";
        document.getElementById("btnFlow").classList.add("is-active");
        document.getElementById("btnFlow").textContent = "💫 流れアニメ";
      }

      let started = false;
      function startApp() {
        if (started) return;
        started = true;
        ensureFxOn();
        rebuildFieldCache();
        rebuildFilingsLayer();
        drawScene();
        loop();
      }

      rebuildFieldCache();
      rebuildFilingsLayer();
      ensureFxOn();

      function loop() {
        phase += 0.035;
        drawScene();
        requestAnimationFrame(loop);
      }
      window.addEventListener("resize", drawScene);
      window.addEventListener("load", startApp);
      if (document.readyState === "complete") startApp();
    })();
  </script>
</body>
</html>
